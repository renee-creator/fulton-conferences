<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Fulton Family Conferences</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a working ledger. Sticky header with tabs, one main column, editor with a side rail for prep and history. */
:root{
  --bg:#F3F5F1; --surface:#FFFFFF; --surface-2:#EBEFEA; --ink:#1E2A23; --muted:#5C6A61; --line:#D8DFD8;
  --accent:#2E5B44; --accent-ink:#FFFFFF; --accent-soft:#E1EBE4;
  --ok:#2F7A4F; --ok-soft:#DDEFE3; --sched:#9A6A1C; --sched-soft:#F6EBD6; --prog:#3D6290; --prog-soft:#E1E9F4; --todo:#7E8983; --todo-soft:#ECEFEC; --danger:#A3392E; --danger-soft:#F7E2DF;
  --f-display:"Young Serif", Georgia, "Times New Roman", serif;
  --f-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121815; --surface:#1A221E; --surface-2:#212B26; --ink:#E4EBE6; --muted:#9BA9A1; --line:#2F3A34;
  --accent:#8EC5A3; --accent-ink:#0F1A14; --accent-soft:#213429;
  --ok:#7FCB9B; --ok-soft:#1F3428; --sched:#E0B568; --sched-soft:#3A2F1B; --prog:#93B6E3; --prog-soft:#1F2B3B; --todo:#8D9892; --todo-soft:#242C28; --danger:#EE8F84; --danger-soft:#3A2220;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121815; --surface:#1A221E; --surface-2:#212B26; --ink:#E4EBE6; --muted:#9BA9A1; --line:#2F3A34;
  --accent:#8EC5A3; --accent-ink:#0F1A14; --accent-soft:#213429;
  --ok:#7FCB9B; --ok-soft:#1F3428; --sched:#E0B568; --sched-soft:#3A2F1B; --prog:#93B6E3; --prog-soft:#1F2B3B; --todo:#8D9892; --todo-soft:#242C28; --danger:#EE8F84; --danger-soft:#3A2220;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.5}
h1,h2,h3{font-family:var(--f-display);font-weight:400;text-wrap:balance;margin:0;line-height:1.2}
h1{font-size:1.6rem} h2{font-size:1.3rem} h3{font-size:1.05rem}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.eyebrow{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{flex:none}
.brand b{font-family:var(--f-display);font-weight:400;font-size:1.1rem;display:block;line-height:1.1}
.brand span{font-size:.75rem;color:var(--muted)}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap}
nav.tabs button{border:0;background:none;padding:8px 12px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:600}
nav.tabs button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.top-actions{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
@media (max-width:640px){header.top{position:static}.top-in{gap:10px}.top-actions{margin-left:0;width:100%}.top-actions .btn{width:100%;justify-content:center}}

main{max-width:1180px;margin:0 auto;padding:24px 16px 80px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600;font-size:.9rem;line-height:1.2;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{border-color:transparent;background:none}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:5px 10px;font-size:.82rem}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}

.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font-size:.78rem;font-weight:600;white-space:nowrap}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st-complete{background:var(--ok-soft);color:var(--ok)}
.st-scheduled{background:var(--sched-soft);color:var(--sched)}
.st-progress{background:var(--prog-soft);color:var(--prog)}
.st-none{background:var(--todo-soft);color:var(--todo)}
.st-held{background:var(--danger-soft);color:var(--danger)}
.pf-late{background:var(--danger-soft)}
input[type=checkbox]{accent-color:var(--accent)}
.st-nosignup{background:var(--surface-2);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.st-withdrawn{background:var(--danger-soft);color:var(--danger)}

/* overview */
.rooms{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.room h3{display:flex;justify-content:space-between;align-items:baseline}
.bar{display:flex;height:10px;border-radius:6px;overflow:hidden;background:var(--todo-soft);margin:10px 0 8px}
.bar i{display:block;height:100%}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend span::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--c)}
.split{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
@media (max-width:900px){.split{grid-template-columns:minmax(0,1fr)}}

.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.list{width:100%;border-collapse:collapse;font-size:.92rem}
table.list th{text-align:left;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
table.list td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
table.list tr:last-child td{border-bottom:0}
table.list tr.click{cursor:pointer}
table.list tr.click:hover td{background:var(--accent-soft)}
.name-cell b{font-weight:600}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters input,.filters select,.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;min-width:0}
.filters input[type=search]{width:220px;max-width:100%}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:7px 12px;cursor:pointer;font-weight:600;font-size:.85rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

.list-plain{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.list-plain li{padding:10px 0;border-bottom:1px solid var(--line);display:flex;gap:10px;justify-content:space-between;align-items:center}
.list-plain li:last-child{border-bottom:0}
.date-tile{font-family:var(--f-mono);font-size:.78rem;text-align:center;border:1px solid var(--line);border-radius:6px;padding:2px 6px;min-width:52px;line-height:1.3}
.date-tile b{display:block;font-size:1rem}

/* editor */
.conf-head{display:flex;gap:16px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;margin-bottom:16px}
.conf-head .who h1{font-size:1.8rem}
.meta-line{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:.9rem;margin-top:4px}
.ed{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
@media (max-width:980px){.ed{grid-template-columns:minmax(0,1fr)}}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.sheet-sec{padding:16px;border-bottom:1px solid var(--line)}
.sheet-sec:last-child{border-bottom:0}
.sheet-title{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:700px){.grid2,.grid3,.grid4{grid-template-columns:minmax(0,1fr)}}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label,.field .lbl{font-weight:600;font-size:.9rem}
.field .hint{font-size:.8rem;color:var(--muted);font-style:italic;margin-top:-2px}
.field textarea{resize:vertical;min-height:84px;line-height:1.45}
.field.full{grid-column:1/-1}
.field.saved textarea,.field.saved input{border-color:var(--ok)}
.domain{border:1px solid var(--line);border-radius:8px;padding:12px;background:var(--bg);display:flex;flex-direction:column;gap:6px;min-width:0}
.domain textarea{background:var(--surface)}
.qnum{font-family:var(--f-mono);color:var(--accent);margin-right:4px}
.rail{display:flex;flex-direction:column;gap:14px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px)}
@media (max-width:980px){.rail{position:static}}
.rail .panel h3{margin-bottom:8px}
.check{display:flex;gap:8px;align-items:flex-start;padding:5px 0;font-size:.9rem}
.check input{margin-top:3px;accent-color:var(--accent)}
.meter{height:6px;background:var(--todo-soft);border-radius:4px;overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--accent)}
.save-state{font-size:.8rem;color:var(--muted)}
.prior{border-left:3px solid var(--sched);padding:6px 10px;background:var(--sched-soft);border-radius:0 6px 6px 0;font-size:.88rem;white-space:pre-wrap}
.attach{display:flex;gap:8px;align-items:center;font-size:.85rem;padding:6px 0;border-bottom:1px solid var(--line)}
.attach:last-child{border-bottom:0}
.attach img{width:44px;height:44px;object-fit:cover;border-radius:4px;border:1px solid var(--line)}
.attach a{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}

/* child page */
.timeline{display:flex;flex-direction:column;gap:12px}
.tl-item{display:grid;grid-template-columns:110px minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:600px){.tl-item{grid-template-columns:minmax(0,1fr)}}
.tl-when{font-family:var(--f-mono);font-size:.82rem;color:var(--muted);padding-top:14px}
.tl-when b{display:block;color:var(--ink);font-family:var(--f-display);font-weight:400;font-size:1.05rem}
.tl-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0}
.tl-card p{margin:.3em 0 0;white-space:pre-wrap}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;font-size:.9rem}
.kv dt{color:var(--muted)} .kv dd{margin:0;overflow-wrap:anywhere}
.compare{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(240px,1fr);gap:12px;overflow-x:auto;padding-bottom:6px}
.compare .tl-card{white-space:pre-wrap}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(10,16,13,.45);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) 16px 24px;overflow-y:auto}
.modal{background:var(--surface);color:var(--ink);border-radius:12px;border:1px solid var(--line);width:100%;max-width:760px;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal.wide{max-width:980px}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:14px}
.drop{border:2px dashed var(--line);border-radius:10px;padding:26px 16px;text-align:center;cursor:pointer;background:var(--bg)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.review-row{display:grid;grid-template-columns:180px minmax(0,1fr) 150px;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:start}
@media (max-width:700px){.review-row{grid-template-columns:minmax(0,1fr)}}
.review-row textarea{width:100%;min-height:60px;border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--surface)}
.review-row .cur{font-size:.8rem;color:var(--muted);white-space:pre-wrap;margin-top:4px}
.progress-note{display:flex;gap:10px;align-items:center;padding:12px;border-radius:8px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.spinner{width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{animation-duration:3s}}
.notice{padding:12px 14px;border-radius:8px;background:var(--sched-soft);color:var(--ink);border:1px solid var(--line);font-size:.9rem}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:80;font-weight:600;font-size:.9rem;max-width:calc(100% - 32px)}
.diff-old{text-decoration:line-through;color:var(--muted)}
.guide li{margin-bottom:6px}
.guide{padding-left:18px;margin:0;font-size:.88rem}
details summary{cursor:pointer;font-weight:600}
.flag-next{display:flex;gap:16px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;background:#fdf3d8;border:1px solid #e3c46f;border-left:5px solid #c9962a;border-radius:10px;padding:12px 16px;margin-bottom:14px;color:#4a3a12}
.flag-next b{color:#3b2d08}
.sc-block{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--surface);margin:2px 0 12px}
.sc-head{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:6px}
.sc-row{display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px;padding:5px 0;border-top:1px dashed var(--line)}
.sc-name{width:72px;font-weight:600;font-size:.9rem}
.sc-block input:not([type=checkbox]){border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);font:inherit}
.sc-opt{display:inline-flex;gap:5px;align-items:center;font-size:.9rem;white-space:nowrap;cursor:pointer}
</style>

<header class="top">
  <div class="top-in">
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><path d="M15 28V15M15 15c-4-1-7-4-8-8M15 15c4-1 7-4 8-8M15 19c-3 0-5-2-6-4M15 19c3 0 5-2 6-4M15 11V3" fill="none" stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round"/><path d="M7 28h16" stroke="var(--muted)" stroke-width="1.6" stroke-linecap="round"/></svg>
      <div><b>Family Conferences</b><span>Fulton Community School &amp; Farm</span></div>
    </div>
    <nav class="tabs" id="tabs">
      <button data-go="overview">Overview</button>
      <button data-go="children">Children</button>
      <button data-go="portfolios">Portfolios</button>
      <button data-go="nextyear">Next year</button>
      <button data-go="settings">Settings</button>
    </nav>
    <div class="top-actions">
      <button class="btn primary" data-act="import-form" id="btn-import-top">Fill from a completed form</button>
    </div>
  </div>
</header>
<main id="app"><div class="empty">Loading conferences and children…</div></main>
<div id="modal-root"></div>

<style>
#gate{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px 16px}
#gate .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px 24px;width:100%;max-width:400px;display:flex;flex-direction:column;gap:14px}
#gate h1{font-size:1.6rem}
#gate input{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;font-size:1rem;width:100%}
#gate .msg{font-size:.9rem;min-height:1.2em}
#gate .msg.bad{color:var(--danger)}
.who-chip{font-size:.85rem;color:var(--muted);display:flex;gap:8px;align-items:center}
</style>
<div id="gate" hidden>
  <form class="card" id="gate-form" autocomplete="off">
    <svg width="34" height="34" viewBox="0 0 30 30" aria-hidden="true"><path d="M15 28V15M15 15c-4-1-7-4-8-8M15 15c4-1 7-4 8-8M15 19c-3 0-5-2-6-4M15 19c3 0 5-2 6-4M15 11V3" fill="none" stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round"/><path d="M7 28h16" stroke="var(--muted)" stroke-width="1.6" stroke-linecap="round"/></svg>
    <div><div class="eyebrow">Fulton Community School &amp; Farm</div><h1>Family Conferences</h1></div>
    <label for="gate-code" class="small" style="font-weight:600">Your passcode</label>
    <input id="gate-code" type="password" autocomplete="current-password" required>
    <button class="btn primary" id="gate-btn" type="submit" style="justify-content:center">Sign in</button>
    <div class="msg muted" id="gate-msg" aria-live="polite"></div>
  </form>
</div>
<script>
"use strict";
/* Connects the conference app to the Fulton conference server on Render.
   Records live in a private GitHub repository behind that server. */
(function(){
  const qs=new URLSearchParams(location.search);
  // only the school's own server, or a local test server when the page itself is opened locally
  const DEFAULT_SERVER="https://fulton-conferences.onrender.com";
  const want=(qs.get("server")||"").replace(/\/+$/,"");
  const local=/^(localhost|127\.0\.0\.1)$/.test(location.hostname) && /^http:\/\/(localhost|127\.0\.0\.1)(:\d+)?$/.test(want);
  const SERVER= local? want : DEFAULT_SERVER;
  const LS={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}};
  const Auth={token:LS.get("fc-token"), name:LS.get("fc-name")};
  const Store={data:{children:{},conferences:{},settings:{}}, rev:0, bootId:"", listeners:new Set(), ready:null, fileKey:"", wroteAt:{}};
  window.CAREFUL_READ=true;
  window.BLOB_URL=id=>SERVER+"/original/"+encodeURIComponent(id)+"?t="+encodeURIComponent(Store.fileKey||"");

  function gateMsg(t,bad){ const m=document.getElementById("gate-msg"); if(m){ m.textContent=t||""; m.className="msg "+(bad?"bad":"muted"); } }
  function signOut(){ Auth.token=null; Auth.name=null; LS.set("fc-token",null); LS.set("fc-name",null); location.reload(); }
  window.FC_SIGN_OUT=signOut;

  async function api(path, body, signal){
    let r;
    const payload=JSON.stringify(body||{});
    // while the page is closing, let the last save finish in the background
    const keepalive=document.visibilityState==="hidden" && payload.length<60000;
    try{ r=await fetch(SERVER+path,{method:"POST",signal,keepalive,headers:{"Content-Type":"application/json",...(Auth.token?{Authorization:"Bearer "+Auth.token}:{})},body:payload}); }
    catch(e){ if(e&&e.name==="AbortError") throw {code:"cancelled"}; throw {code:"unavailable", message:"The conference server could not be reached. Check your internet connection and try again."}; }
    let j={}; try{ j=await r.json(); }catch(e){}
    if(r.status===401 && path!=="/login"){ signOut(); throw {code:"session_expired", message:j.error}; }
    if(r.status===429) throw {code:"rate_limited", message:j.error};
    if(!r.ok) throw {status:r.status, message:j.error||("The server answered "+r.status+".")};
    return j;
  }
  function notify(){ for(const l of [...Store.listeners]) try{ l(); }catch(e){ console.error(e); } }
  function saveBanner(msg, warn){ let b=document.getElementById("save-banner"); if(!msg){ if(b) b.remove(); return; } if(!b){ b=document.createElement("div"); b.id="save-banner"; b.setAttribute("role","alert"); b.style.cssText=(warn?"background:#8a5a00;":"background:var(--danger);")+"color:#fff;padding:10px 16px;font-weight:600;text-align:center"; document.body.prepend(b); } b.textContent=warn? msg : msg+" Records can still be read, but nothing new is saved until this is fixed."; b.style.background=warn?"#8a5a00":"var(--danger)"; }
  async function loadAll(){ const j=await api("/api/data"); saveBanner(j.saveError||j.saveWarn, !j.saveError); if(j.fileKey) Store.fileKey=j.fileKey; Store.data={children:{},conferences:{},settings:{},...j.data}; Store.rev=j.rev; Store.bootId=j.bootId; notify(); }

    }catch(e){} finally{ polling=false; }

  /* wake the server, which sleeps after 15 quiet minutes on Render's free plan */
  async function wake(){

  }

  }

  function snap(id,d){ return {id, exists:!!d, data:()=>d?JSON.parse(JSON.stringify(d)):undefined, metadata:{fromCache:false,hasPendingWrites:false}}; }
  function query(kind){

      async get(){ const docs=Object.entries(Store.data[kind]||{}).map(([id,d])=>snap(id,d)); return {docs,size:docs.length,empty:!docs.length}; },

    return { id, path,

  }

  function blobToJpegB64(blob, max=1800){
    return new Promise(async(resolve,reject)=>{
      try{ const bmp=await createImageBitmap(blob); const s=Math.min(1,max/Math.max(bmp.width,bmp.height)); const cv=document.createElement("canvas"); cv.width=Math.round(bmp.width*s); cv.height=Math.round(bmp.height*s);
        const c=cv.getContext("2d"); c.fillStyle="#fff"; c.fillRect(0,0,cv.width,cv.height); c.drawImage(bmp,0,0,cv.width,cv.height);
        cv.toBlob(b=>{ const fr=new FileReader(); fr.onload=()=>resolve(String(fr.result).split(",")[1]); fr.onerror=reject; fr.readAsDataURL(b); },"image/jpeg",.85); }
      catch(e){ reject({code:"image_rejected"}); }
    });
  }
  function blobToB64(blob){ return new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>res(String(fr.result).split(",")[1]); fr.onerror=rej; fr.readAsDataURL(blob); }); }
  function looseJson(t){ t=String(t||"").trim(); try{ return JSON.parse(t); }catch(e){} const f=t.match(/```(?:json)?\s*([\s\S]*?)```/); if(f){ try{ return JSON.parse(f[1]); }catch(e){} } const a=t.indexOf("{"), b=t.lastIndexOf("}"); if(a>=0&&b>a){ try{ return JSON.parse(t.slice(a,b+1)); }catch(e){} } return undefined; }
  async function ask(input, opts={}){

    const content=[]; const imgs=opts.images? (Array.isArray(opts.images)?opts.images:[...(opts.images.length!=null&&!(opts.images instanceof Blob)?opts.images:[opts.images])]) : [];
    for(const b of imgs) content.push({type:"image",source:{type:"base64",media_type:"image/jpeg",data:await blobToJpegB64(b)}});

  }
  const sample=Object.assign(async(input,opts)=>{ const j=await ask(input,opts); return {text:j.text, truncated:!!j.truncated, modelTierApplied:"default"}; }, {
    limits:async()=>({maxPromptBytes:262144, images:{maxCount:5, maxInputBytes:20e6, mediaTypes:["image/jpeg","image/png","image/webp","image/gif"]}}),
    json:async(input,opts)=>{ const j=await ask(input,opts); const v=looseJson(j.text); if(v===undefined) throw {code:"invalid_json", text:j.text}; return v; }
  });
  const assets={
    async upload(blob){ const type=blob.type||"application/octet-stream"; const ext={"application/pdf":"pdf","image/jpeg":"jpg","image/png":"png","image/webp":"webp"}[type];
      if(!ext) throw {code:"unsupported_type"};

})();

const LABEL_LINE=/^From (the|another) form.*$/gm;

function lev(a,b){ const m=a.length,n=b.length; let prev=Array.from({length:n+1},(_,j)=>j); for(let i=1;i<=m;i++){ const cur=[i]; for(let j=1;j<=n;j++) cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1)); prev=cur; } return prev[n]; }

}
function pad2(n){ return String(n).padStart(2,"0"); }
// work out the season from whatever the form gives: a full date, a month, or the child's age written on it
function inferSeason(r, child){
  const today=new Date(); const tooLate=d=>d>new Date(today.getTime()+45*864e5);
  const iso=toISODate(r?.conferenceDate);
  if(iso && !tooLate(new Date(iso+"T12:00:00"))) return {...currentPeriod(new Date(iso+"T12:00:00")), date:iso, how:"date"};
  const mo=Math.round(+r?.conferenceMonth)||0, day=Math.round(+r?.conferenceDay)||0; let yr=Math.round(+r?.conferenceYear)||0;
  const ageM=Math.round(+r?.ageMonths)||0;
  let approx=null;
  if(ageM>0 && child?.dob){ approx=new Date(child.dob+"T12:00:00"); approx.setMonth(approx.getMonth()+ageM); }
  let how = yr? "date" : "age";
  if(mo>=1&&mo<=12 && !yr && approx){ let best=null; for(const y of [approx.getFullYear()-1,approx.getFullYear(),approx.getFullYear()+1]){ const diff=Math.abs(new Date(y,mo-1,15)-approx); if(!best||diff<best.diff) best={y,diff}; } if(best.diff<=150*864e5) yr=best.y; }
  if(mo>=1&&mo<=12 && yr>=2015){ const d=new Date(yr,mo-1,day||15); if(!tooLate(d)) return {...currentPeriod(d), date: day? `${yr}-${pad2(mo)}-${pad2(day)}` : "", how}; }
  if(approx && !mo && !tooLate(approx)) return {...currentPeriod(approx), date:"", how:"age"};
  return {year:"", term:"Historical", date:"", how:"unknown"};
}
function seasonNote(how){ return how==="age"? "Season worked out from the age written on the form" : how==="unknown"? "Date unclear, kept with earlier conferences" : ""; }
function childName(c){ return c ? [c.first,c.last].filter(Boolean).join(" ") || c.name || "Unnamed child" : "Unknown child"; }
function activeChildren(){ return Object.values(S.children).filter(c=>c.status!=="withdrawn"); }
function confsFor(childId){ return Object.values(S.confs).filter(c=>c.childId===childId).sort(confSort); }
function confSort(a,b){ return confKey(a).localeCompare(confKey(b)); }
function filledCount(c){ let n=0; FIELDS.forEach(f=>{ if((c.fields?.[f.k]||"").trim()) n++; }); REFLECTIONS.forEach(r=>{ if((c.reflections?.[r.k]||"").trim()) n++; }); return n; }
const TOTAL_FIELDS = FIELDS.length + REFLECTIONS.length;
function todayISO(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
function hasWork(c){ return !!c.signup || filledCount(c)>0 || Object.values(c.prep||{}).some(Boolean) || (c.attachments||[]).length>0 || (c.staffNotes||"").trim() || (c.teacher||"").trim(); }
function confStatus(c){
  if(!c) return {key:"none",label:"Not started"};
  if(c.term==="Historical") return {key:"complete",label:"Earlier record"};
  if(c.status==="complete") return {key:"complete",label:"Complete"};
  if(NO_SIGNUP[c.signup]) return {key:"nosignup",label:NO_SIGNUP[c.signup]};
  if(c.confDate && c.confDate<todayISO()) return {key:"held",label:"Date passed"};
  if(c.confDate) return {key:"scheduled",label:"Scheduled"};
  if(c.signup==="signedup") return {key:"progress",label:"Signed up"};
  if(c.signup==="invited") return {key:"progress",label:"Invited"};
  if(c.signup==="rescheduling") return {key:"progress",label:"Rescheduling"};
  if(!hasWork(c)) return {key:"none",label:"Not started"};
  return {key:"progress",label:"Preparing"};
}
function parseTime(v){
  const m=String(v||"").trim().match(/^(\d{1,2})(?::(\d{2}))?\s*([ap])?\.?\s*m?\.?$/i); if(!m) return "";
  let h=+m[1]; const mi=m[2]||"00"; const ap=(m[3]||"").toLowerCase();
  if(ap==="p" && h<12) h+=12; if(ap==="a" && h===12) h=0;
  if(!ap && h>=1 && h<=6) h+=12; // school-day afternoon times written without am or pm
  if(h>23||+mi>59) return ""; return String(h).padStart(2,"0")+":"+mi;
}
function chip(st){ return `<span class="chip st-${st.key}">${esc(st.label)}</span>`; }
function periodConf(childId, p=S.period){ return Object.values(S.confs).find(c=>c.childId===childId && c.schoolYear===p.year && c.term===p.term); }
function priorConf(conf){
  const list = confsFor(conf.childId).filter(c=>c.id!==conf.id && confKey(c) < (confKey(conf)||"9999"));
  return list.length? list[list.length-1] : null;
}
function groupsList(){ return Array.isArray(S.settings.groups)? S.settings.groups : DEFAULT_GROUPS; }
function groupOf(c){ return c?.group ? groupsList().find(g=>g.name===c.group) : null; }
function educatorOf(c){ return (c?.primaryEducator||"").trim() || groupOf(c)?.educator || ""; }
function educatorsFor(room){ const e=S.settings.educators||{}; const g=groupsList().filter(x=>!room||x.room===room).map(x=>x.educator); return [...new Set([...(room? (e[room]||[]) : Object.values(e).flat()), ...g].filter(Boolean))]; }
function eduFilter(list){ const f=S.filters.edu||"All"; return f==="All"? list : list.filter(c=>educatorOf(c)===f); }
const SORTS=[["room","Classroom, then first name"],["last","Last name"],["first","First name"],["age","Oldest first"]];
function sortKids(list){
  const s=S.filters.sort||"room", by=(k)=>(x,y)=>(!x[k])-(!y[k]) || (x[k]||"").localeCompare(y[k]||"");
  const rooms=S.settings.classrooms||[], ri=c=>{ const i=rooms.indexOf(c.classroom); return i<0? 99 : i; };
  const cmp={room:(a,b)=>ri(a)-ri(b)||by("classroom")(a,b)||by("first")(a,b)||by("last")(a,b),
    last:(a,b)=>by("last")(a,b)||by("first")(a,b), first:(a,b)=>by("first")(a,b)||by("last")(a,b),
    age:(a,b)=>(a.dob||"9999").localeCompare(b.dob||"9999")||by("last")(a,b)}[s]||((a,b)=>0);
  return list.sort(cmp);
}
function sortSelect(){ const s=S.filters.sort||"room"; return `<select id="f-sort" aria-label="Sort by">${SORTS.map(([k,l])=>`<option value="${k}" ${s===k?"selected":""}>Sort by ${l.toLowerCase()}</option>`).join("")}</select>`; }
function eduSelect(){ const all=educatorsFor(); const f=S.filters.edu||"All"; return `<select id="f-edu" aria-label="Educator"><option value="All">Every educator</option>${all.map(n=>`<option ${f===n?"selected":""}>${esc(n)}</option>`).join("")}</select>`; }
function nextFallYear(d=new Date()){ return d.getMonth()>=7? d.getFullYear()+1 : d.getFullYear(); }
function ageOnSept1(dob, year){ if(!dob) return null; const b=new Date(dob+"T12:00:00"), s=new Date(year,8,1,12); let a=s.getFullYear()-b.getFullYear(); if(s.getMonth()<b.getMonth()||(s.getMonth()===b.getMonth()&&s.getDate()<b.getDate())) a--; return a; }
function eligibility(c, year){ const a=ageOnSept1(c.dob, year); if(a==null) return null; if(a>=6) return {key:"1st",label:"First grade"}; if(a>=5) return {key:"k",label:"Kindergarten"}; if(a>=4) return {key:"tk",label:"TK"}; return null; }
function onboardCount(c){ return ONBOARD.filter(s=>c.onboarding?.[s.k]).length; }
function isNewChild(c){ if(c.status==="withdrawn") return false; if(onboardCount(c)>=ONBOARD.length) return false; if(c.onboarding?.started) return true; const e=c.enrollDate? new Date(c.enrollDate+"T12:00:00") : null; return !!e && (e-new Date())> -45*864e5; }
async function saveChildField(id, path, val){ try{ await dbUpdate("children/"+id, setPath({updatedAt:nowISO()}, path, val)); }catch(e){} }

function setPath(obj, path, val){ const parts=path.split("."); let o=obj; parts.slice(0,-1).forEach(p=>{ o[p]=o[p]||{}; o=o[p]; }); o[parts.at(-1)]=val; return obj; }

/* ---------- capabilities ---------- */
async function boot(){
  render();
  if(!window.claude?.use){ S.dbState="absent"; render(); return; }
  const use = n => window.claude.use(n).catch(()=>null);
  const [db,user,sample,assets,downloads] = await Promise.all(["db","user","sample","assets","downloads"].map(use));
  Object.assign(S,{db,user,sample,assets,downloads});
  if(user){
    try{ S.uid = await user.id(); }catch(e){}
    try{ const w = user.can ? await user.can("data.write") : null; S.canWrite = w; }catch(e){}
  }
  if(!db){ S.dbState="absent"; render(); return; }
  S.dbState="ok";
  const onErr = e => { console.warn(e); if(e?.code==="revoked"){ S.dbState="absent"; render(); } };
  db.collection("children").limit(1000).onSnapshot(snap=>{
    const m={}; snap.docs.forEach(d=>{ m[d.id]={id:d.id,...d.data()}; }); S.children=m; S.loaded.children=true; refresh();
  }, onErr);
  db.collection("conferences").limit(1000).onSnapshot(snap=>{
    const m={}; snap.docs.forEach(d=>{ m[d.id]={id:d.id,...d.data()}; }); S.confs=m; S.loaded.confs=true; refresh();
  }, onErr);
  db.doc("settings/main").onSnapshot(snap=>{
    if(snap.exists){ const d=snap.data(); S.settings={...structuredClone(DEFAULT_SETTINGS),...d}; }
    refresh();
  }, onErr);
}
let rafPending=false;
function refresh(){
  if(rafPending) return; rafPending=true;
  requestAnimationFrame(()=>{ rafPending=false;
    if(S.view.name==="conf" && $("#conf-editor")?.dataset.id===S.view.id){ syncEditor(); return; }
    if(S.view.name==="settings" && $("#settings-form")) return; // avoid clobbering typing
    const ae=document.activeElement; if(ae && ae.dataset?.ck && /TEXTAREA|INPUT/.test(ae.tagName) && ae.type!=="checkbox"){ S.deferRender=true; return; }
    render();
  });
}
async function resolveNames(ids){
  if(!S.user?.profiles) return;
  const need = [...new Set(ids.filter(i=>i && !(i in S.names)))];
  if(!need.length) return;
  try{ const ps = await S.user.profiles(need); need.forEach(i=>{ S.names[i] = ps?.[i]?.name || ""; }); }catch(e){ need.forEach(i=>S.names[i]=""); }
}
const whoName = id => (id && S.names[id]) || (id===S.uid ? "you" : "a teammate");

/* ---------- db writes ---------- */
async function dbSet(path, data){ if(!canEdit()) throw new Error("read-only"); try{ await S.db.doc(path).set(data); } catch(e){ handleWriteError(e); throw e; } }
async function dbUpdate(path, data){ if(!canEdit()) throw new Error("read-only"); try{ await S.db.doc(path).update(data); } catch(e){ handleWriteError(e); throw e; } }
async function dbDelete(path){ try{ await S.db.doc(path).delete(); }catch(e){ handleWriteError(e); throw e; } }
function handleWriteError(e){
  console.warn(e);
  if(e?.code==="invalid_argument" && S.canWrite==null){ S.canWrite=false; toast("Your access is view-only. Ask Renee for contributor access to make changes."); render(); }
  else if(e?.code==="quota_exceeded") toast("Storage is full. Remove old attachments or records, then try again.");
  else if(e?.message && !e?.code) toast(e.message);
  else toast("That change did not save. Check your connection and try again.");
}

/* ---------- routing ---------- */
function go(name, extra={}){ flushAll(); S.view={name,...extra}; window.scrollTo(0,0); render(); }
document.addEventListener("click", e=>{
  if(e.target.closest("tr[data-go], tr[data-act]") && e.target.closest("select, input, textarea, label")) return;
  const g = e.target.closest("[data-go]"); if(g){ e.preventDefault(); go(g.dataset.go, g.dataset.id?{id:g.dataset.id}:{}); return; }
  const a = e.target.closest("[data-act]"); if(a){ e.preventDefault(); actions[a.dataset.act]?.(a, e); }

function render(){
  $$("#tabs [data-go]").forEach(b=>b.setAttribute("aria-current", (b.dataset.go===S.view.name || (S.view.name==="child"&&b.dataset.go==="children") || (S.view.name==="conf"&&b.dataset.go==="overview"))?"page":"false"));

  if(!S.loaded.children || !S.loaded.confs){ app.innerHTML = `<div class="empty"><span class="spinner" style="display:inline-block;vertical-align:middle"></span> Loading conferences and children…</div>`; return; }
  const v=S.view.name; checkFilters();

  const sel = keepId && "selectionStart" in ae ? [ae.selectionStart, ae.selectionEnd] : null;

        <div class="row" style="margin-top:12px"><button class="btn sm" data-act="export-csv">Download season list (CSV)</button></div>

}

  if(f.room!=="All") list=list.filter(c=>c.classroom===f.room);
  list=eduFilter(list);
  if(f.q) list=list.filter(c=>(childName(c)+" "+(c.parents||[]).map(p=>p.name).join(" ")).toLowerCase().includes(f.q.toLowerCase()));
  sortKids(list);
  const rows = list.map(c=>{ const n=confsFor(c.id).length;
    return `<tr class="click" tabindex="0" data-go="child" data-id="${esc(c.id)}">
    <td class="name-cell"><b>${esc(childName(c))}</b>${c.status==="withdrawn"?' <span class="chip st-withdrawn">Withdrawn</span>':""}</td>
    <td class="mono small">${esc(fmtDate(c.dob))}</td><td class="small">${esc(ageAt(c.dob))}</td>
    <td>${esc(c.classroom||"")}</td>
    <td class="small">${canEdit()? `<select data-group-for="${esc(c.id)}" aria-label="Small group for ${esc(childName(c))}"><option value="">Choose</option>${groupsList().filter(g=>!c.classroom||g.room===c.classroom).map(g=>`<option ${c.group===g.name?"selected":""}>${esc(g.name)}</option>`).join("")}</select>` : esc(c.group||"")}<div class="muted">${esc(educatorOf(c))}</div></td>
    <td class="small">${esc((c.parents||[]).map(p=>p.name).join(", "))}</td>

    <div class="seg" role="group" aria-label="Enrollment">${[["active","Enrolled"],["withdrawn","Withdrawn"],["all","All"]].map(([k,l])=>`<button data-act="show" data-v="${k}" aria-pressed="${f.show===k}">${l}</button>`).join("")}</div>
    ${eduSelect()}${sortSelect()}
    <span id="live-meta"><span class="small muted mono">${list.length} shown</span></span>

  : `<div class="panel empty">No children here yet. ${canEdit()?`<button class="btn" data-act="child-new">Add a child</button>`:""}</div>`}</div>`;

function viewChild(id){
  const c=S.children[id]; if(!c) return `<div class="empty">This child is no longer on the roster. <a href="#" data-go="children">Back to children</a></div>`;
  const list=confsFor(id);
  const domSel = S.view.domain || "goals";
  const opts = [...FIELDS.map(f=>[ "f."+f.k, f.label ]), ...REFLECTIONS.map((r,i)=>["r."+r.k, "Family Reflection "+(i+1)])];
  const pick = domSel.includes(".")? domSel : "f."+domSel;
  const getV = (cf)=> pick.startsWith("f.")? cf.fields?.[pick.slice(2)] : cf.reflections?.[pick.slice(2)];
  const labelFor = pick.startsWith("f.")? FIELDS.find(f=>"f."+f.k===pick)?.label : REFLECTIONS.find(r=>"r."+r.k===pick)?.q;
  const tl = list.map(cf=>{ const st=confStatus(cf);
    const goals=(cf.fields?.goals||"").trim(), next=(cf.fields?.nextSteps||"").trim(), str=(cf.fields?.strengths||"").trim();
    return `<div class="tl-item"><div class="tl-when"><b>${esc(cf.term==="Historical"?"Earlier":confLabel(cf))}</b>${cf.reason?`<div>${esc(cf.reason)}</div>`:""}${esc(fmtDate(cf.confDate)||"Date not set")}<div>${esc(ageAt(c.dob, cf.confDate||undefined))}</div></div>
      <div class="tl-card"><div class="spread"><div class="row">${chip(st)}<span class="small muted">${esc(cf.teacher||"")}</span></div><div class="row"><span class="mono small muted">${filledCount(cf)}/${TOTAL_FIELDS}</span><button class="btn sm" data-go="conf" data-id="${esc(cf.id)}">Open</button></div></div>
      ${str?`<div style="margin-top:10px"><div class="eyebrow">Strengths</div><p>${esc(str)}</p></div>`:""}
      ${goals?`<div style="margin-top:10px"><div class="eyebrow">Shared goals</div><p>${esc(goals)}</p></div>`:""}
      ${next?`<div style="margin-top:10px"><div class="eyebrow">Next steps</div><p>${esc(next)}</p></div>`:""}
      ${cf.prevGoalsProgress?`<div style="margin-top:10px"><div class="eyebrow">Progress on earlier goals</div><p>${esc(cf.prevGoalsProgress)}</p></div>`:""}
      </div></div>`; }).join("");
  const withVal = list.filter(cf=>(getV(cf)||"").trim());
  const p = periodConf(id);
  return `
  <div style="margin-bottom:6px"><a href="#" data-go="children" class="small">All children</a></div>
  <div class="conf-head"><div class="who"><div class="eyebrow">${esc(c.classroom||"")} classroom</div><h1>${esc(childName(c))}</h1>
    <div class="meta-line"><span>Born ${esc(fmtDate(c.dob))}</span><span>${esc(ageAt(c.dob))}</span>${c.program?`<span>${esc(c.program)}</span>`:""}${c.status==="withdrawn"?'<span class="chip st-withdrawn">Withdrawn</span>':""}</div></div>
    <div class="row">${canEdit()?`<button class="btn" data-act="child-edit" data-id="${esc(id)}">Edit details</button>
      <button class="btn" data-act="conf-new-additional" data-id="${esc(id)}">Add an extra conference</button>
      <button class="btn primary" data-act="open-child-conf" data-id="${esc(id)}">${p?"Open":"Start"} ${esc(periodLabel(S.period))} conference</button>`:""}
      <button class="btn" data-act="pdf-child" data-id="${esc(id)}">Print ${esc(periodLabel(S.period))} form (PDF)</button>
      ${list.length?`<button class="btn" data-act="docx-child" data-id="${esc(id)}">Download full record (Word)</button>`:""}</div>
  </div>
  <div class="split">
    <div class="stack" style="min-width:0">
      <h2>Conferences over time</h2>
      ${list.length? `<div class="timeline">${tl}</div>` : `<div class="panel empty">No conferences yet. Start the ${esc(periodLabel(S.period))} conference to begin this child's record.</div>`}
      ${list.length>0? `<div class="panel stack" style="gap:10px"><div class="spread"><h3>Compare one area across conferences</h3>
        <select id="cmp" aria-label="Area to compare">${opts.map(([k,l])=>`<option value="${k}" ${k===pick?"selected":""}>${esc(l)}</option>`).join("")}</select></div>
        <p class="small muted" style="margin:0">${esc(labelFor||"")}</p>
        ${withVal.length? `<div class="compare">${withVal.map(cf=>`<div class="tl-card"><div class="eyebrow">${esc(confLabel(cf))}${cf.confDate?" · "+esc(ageAt(c.dob, cf.confDate)):""}</div><p>${esc(getV(cf))}</p></div>`).join("")}</div>` : `<p class="small muted">Nothing written in this area yet.</p>`}
      </div>`:""}
    </div>
    <aside class="stack">
      <div class="panel"><h3>Family</h3>
        ${(c.parents||[]).length? (c.parents||[]).map(pr=>`<div style="padding:6px 0;border-bottom:1px solid var(--line)"><b>${esc(pr.name)}</b><div class="small muted mono" style="user-select:all">${esc(pr.cell||"")}</div><div class="small" style="user-select:all;overflow-wrap:anywhere">${esc(pr.email||"")}</div></div>`).join("") : `<p class="small muted">No family contacts on file.</p>`}
      </div>
      ${childPanels(c)}
      <div class="panel"><h3>On file</h3><dl class="kv">
        <dt>Small group</dt><dd>${esc(c.group||"Not set")}</dd>
        <dt>Primary educator</dt><dd>${esc(educatorOf(c)||"Not set")}</dd>
        <dt>Schedule</dt><dd>${esc(c.schedule||"")}</dd>
        <dt>Enrolled</dt><dd>${esc(fmtDate(c.enrollDate))}</dd>
        <dt>IEP/IFSP</dt><dd>${esc(c.ifsp||"None listed")}</dd>
        ${c.notes?`<dt>Notes</dt><dd>${esc(c.notes)}</dd>`:""}
      </dl></div>
    </aside>
  </div>`;
}

function childPanels(c){
  const ro=!canEdit(), dis=ro?"disabled":""; const id=c.id; const ob=c.onboarding||{};
  const ck=(path,label,on)=>`<label class="check"><input type="checkbox" data-ck="${esc(id)}|${path}" ${on?"checked":""} ${dis}><span>${esc(label)}</span></label>`;
  // getting started
  const showOb = isNewChild(c) || S.view.showOb;
  const onboard = showOb? `<div class="panel"><div class="spread"><h3>Getting started</h3><span class="mono small muted">${onboardCount(c)}/${ONBOARD.length}</span></div>
    ${ONBOARD.map(s=>ck("onboarding."+s.k, s.label, ob[s.k])).join("")}
    <div class="grid2" style="margin-top:8px">
      <div class="field"><label for="ob-type">Visit</label><select id="ob-type" data-ck="${esc(id)}|onboarding.visitType" ${dis}>${["","Home visit","Garden visit"].map(o=>`<option value="${o}" ${(ob.visitType||"")===o?"selected":""}>${o||"Choose"}</option>`).join("")}</select></div>
      <div class="field"><label for="ob-date">Visit date</label><input type="date" id="ob-date" data-ck="${esc(id)}|onboarding.visitDate" value="${esc(ob.visitDate||"")}" ${dis}></div>
    </div>
    <div class="field" style="margin-top:8px"><label for="ob-notes">Visit notes</label><div class="hint">The Garden Visit questions, filled in after the visit</div><textarea id="ob-notes" data-ck="${esc(id)}|onboarding.visitNotes" rows="4" ${dis}>${esc(ob.visitNotes||"")}</textarea></div>
    ${!ro && S.sample? `<button class="btn sm" style="margin-top:8px" data-act="visit-upload" data-id="${esc(id)}">Read visit notes from a photo or PDF</button>`:""}
  </div>` : (!ro? `<div class="panel"><button class="btn sm ghost" data-act="show-onboarding">Show the getting started checklist</button></div>` : "");
  // portfolio
  const yr=S.period.year; const pf=c.portfolio?.[yr]||{}; const done=MONTHS.filter(m=>pf[m]).length;
  const portfolio=`<div class="panel"><div class="spread"><h3>Portfolio ${esc(yr)}</h3><span class="mono small muted">${done} of 12 pages</span></div>
    <div class="row" style="gap:4px 10px">${MONTHS.map(m=>`<label class="check" style="padding:2px 0"><input type="checkbox" data-pf="${esc(id)}|${yr}|${m}" ${pf[m]?"checked":""} ${dis}><span class="small">${m}</span></label>`).join("")}</div></div>`;
  // next year
  const ny=nextFallYear(), key=`${ny}-${String(ny+1).slice(2)}`, el=eligibility(c, ny), tr=c.transition?.[key]||{};
  const next = el? `<div class="panel"><h3>Fall ${ny}</h3><p class="small muted" style="margin:0 0 8px">Age ${ageOnSept1(c.dob,ny)} on September 1, so eligible for ${esc(el.label)}.</p>
    <div class="field"><label for="tr-plan">Plan</label><select id="tr-plan" data-ck="${esc(id)}|transition.${key}.plan" ${dis}>${PLANS.map(([v,l])=>`<option value="${v}" ${(tr.plan||"")===v?"selected":""}>${l}</option>`).join("")}</select></div>
    <div class="field" style="margin-top:8px"><label for="tr-school">Next school</label><input id="tr-school" data-ck="${esc(id)}|transition.${key}.school" value="${esc(tr.school||"")}" ${dis}></div>
    ${ck(`transition.${key}.infoNight`,"Came to the Kindergarten and TK Info Night",tr.infoNight)}
    ${ck(`transition.${key}.recordsShared`,"Records or portfolio shared with the next school",tr.recordsShared)}
  </div>` : "";
  return onboard + portfolio + next;
}

/* ---------- conference editor ---------- */
// On the conference form, flag a child who can start TK or Kindergarten the fall after this school year
function nextYearInfo(c, cf){
  if(!c || !cf || cf.term==="Historical") return null;
  const start=parseInt(cf.schoolYear,10); if(!Number.isFinite(start)) return null; const ny=start+1;
  if(ny<nextFallYear()) return null;
  const el=eligibility(c, ny); if(!el) return null;
  const key=`${ny}-${String(ny+1).slice(2)}`;
  return {ny, el, key, age:ageOnSept1(c.dob,ny), plan:c.transition?.[key]?.plan||"",
    text:`Eligible for ${el.label} in Fall ${ny}.`, more:`${c.first||"This child"} will be ${ageOnSept1(c.dob,ny)} on September 1, so talk with the family about next year at this conference.`};
}
function nextYearFlag(c, cf, dis){
  const info=nextYearInfo(c, cf); if(!info) return "";
  const {ny, el, key}=info, tr=c.transition?.[key]||{};
  return `<div class="flag-next" role="note"><div><b>Eligible for ${esc(el.label)} in Fall ${ny}.</b> ${esc(c.first||"This child")} will be ${ageOnSept1(c.dob,ny)} on September 1, so talk with the family about next year at this conference.</div>
    <div class="field" style="margin:0;min-width:220px"><label for="flag-plan">Family's plan</label><select id="flag-plan" data-ck="${esc(c.id)}|transition.${key}.plan" ${dis}>${PLANS.map(([v,l])=>`<option value="${v}" ${(tr.plan||"")===v?"selected":""}>${l}</option>`).join("")}</select></div></div>`;
}

/* autosave */
const pending = new Map(); let saveTimer=null; let inflight=0;
const dirty = new Set();
function queueSave(path, val){
  pending.set(path,val); dirty.add(path);
  setSaveState("Saving…");
  clearTimeout(saveTimer); saveTimer=setTimeout(flushAll, 900);
}
let saveChain=Promise.resolve();
function flushAll(){
  clearTimeout(saveTimer);
  if(!pending.size || S.view.name!=="conf") { pending.clear(); if(!inflight) dirty.clear(); return saveChain; }
  const id=S.view.id; const patch={};
  for(const [p,v] of pending) setPath(patch,p,v);
  const keys=[...pending.keys()]; pending.clear();
  patch.updatedAt=nowISO(); if(S.uid) patch.updatedBy=S.uid;
  // one write at a time per conference, in the order they were typed
  saveChain = saveChain.then(async()=>{
    inflight++;
    try{ await dbUpdate("conferences/"+id, patch); keys.forEach(k=>{ if(!pending.has(k)) dirty.delete(k); }); if(!pending.size) setSaveState("Saved"); }
    catch(e){
      if(S.view.name==="conf" && S.view.id===id){ keys.forEach(k=>{ if(!pending.has(k)) pending.set(k, getPath(patch,k)); }); setSaveState("Not saved. It will try again when you keep typing."); }
      else { keys.forEach(k=>dirty.delete(k)); toast("Your last changes to that conference did not save. Open it again and re-enter them."); }
    }
    finally{ inflight--; }
  });
  return saveChain;
}
document.addEventListener("visibilitychange", ()=>{ if(document.hidden) flushAll(); });
window.addEventListener("pagehide", ()=>flushAll());
window.addEventListener("beforeunload", e=>{ if(pending.size||inflight){ flushAll(); e.preventDefault(); e.returnValue=""; } });
function setSaveState(t){ const el=$("#save-state"); if(el) el.textContent=t; }
function grow(t){ t.style.height="auto"; t.style.height=Math.max(t.scrollHeight+2, 84)+"px"; }
function afterConfRender(){
  const ed=$("#conf-editor"); if(!ed) return;
  $$("textarea",ed).forEach(grow);
  ed.addEventListener("input", e=>{
    const t=e.target; if(!t.dataset.k) return;
    if(t.tagName==="TEXTAREA") grow(t);
    const v = t.type==="checkbox"? t.checked : t.value;
    queueSave(t.dataset.k, v);
    if(t.dataset.k.startsWith("fields.")||t.dataset.k.startsWith("reflections.")) updateMeter();
  });
  ed.addEventListener("change", e=>{ const t=e.target; if(t.dataset.k && (t.type==="date"||t.tagName==="SELECT"||t.type==="checkbox"||t.type==="time")) flushAll(); });
  ed.addEventListener("focusout", e=>{ if(e.target.dataset?.k) flushAll(); });
  updateLastEdit();
}
function updateMeter(){
  const vals={fields:{},reflections:{}};
  $$("#conf-editor textarea[data-k]").forEach(t=>{ const [g,k]=t.dataset.k.split("."); if(vals[g]) vals[g][k]=t.value; });
  const n=filledCount(vals); const m=$("#meter"); if(m) m.style.width=(n/TOTAL_FIELDS*100)+"%"; const fc=$("#fill-count"); if(fc) fc.textContent=`${n}/${TOTAL_FIELDS} sections filled`;
}
async function updateLastEdit(){
  const cf=S.confs[S.view.id]; const el=$("#last-edit"); if(!cf||!el) return;
  if(!cf.updatedAt){ el.textContent=""; return; }
  await resolveNames([cf.updatedBy]);
  el.textContent = `Last edited ${new Date(cf.updatedAt).toLocaleString([], {month:"short",day:"numeric",hour:"numeric",minute:"2-digit"})} by ${whoName(cf.updatedBy)}`;
}
function syncEditor(){
  const cf=S.confs[S.view.id]; if(!cf){ render(); return; }
  $$("#conf-editor [data-k]").forEach(el=>{
    const k=el.dataset.k; if(dirty.has(k)) return;
    const v=getPath(cf,k);
    if(el.type==="checkbox"){ el.checked=!!v; } else if((el.value||"")!==(v||"")){ el.value=v||""; if(el.tagName==="TEXTAREA") grow(el); }
  });
  const chipEl=$("#conf-chip"); if(chipEl) chipEl.innerHTML=chip(confStatus(cf));
  const btn=$('[data-act="toggle-complete"]'); if(btn) btn.textContent= cf.status==="complete"?"Reopen conference":"Mark conference complete";
  const al=$("#attach-list"); if(al) al.innerHTML=attachList(cf);
  updateMeter(); updateLastEdit();
}

async function createConf(childId, year, term){
  const id = term==="Historical"? `${childId}--historical` : term==="Additional"? `${childId}--${year}-add-${uid().slice(0,5)}` : `${childId}--${year}-${term.toLowerCase()}`;
  const doc = {childId, schoolYear: term==="Historical"? "" : year, term, status:"open", fields:{}, reflections:{}, prep:{}, attachments:[], createdAt:nowISO(), updatedAt:nowISO(), ...(S.uid?{createdBy:S.uid,updatedBy:S.uid}:{})};
  const c=S.children[childId]; if(educatorOf(c)) doc.teacher=educatorOf(c);
  try{
    // a co-teacher may have started this same conference a moment ago, so never overwrite it
    const ref=S.db.doc("conferences/"+id);
    if(ref.create){ const d=await ref.create(doc); S.confs[id]={id,...(d||doc)}; return id; }
    const ex = await ref.get().catch(()=>null);
    if(ex?.exists){ S.confs[id]={id,...ex.data()}; return id; }
    await dbSet("conferences/"+id, doc); S.confs[id]={id,...doc}; return id;
  }catch(e){ return null; }
}

  const borders={top:border,bottom:border,left:border,right:border};
  const paras=(t,opts={})=>{ const lines=String(t||"").split(/\n/); return lines.map(l=>new D.Paragraph({spacing:{after:20},children:[new D.TextRun({text:l,size:18,...opts})]})); };
  const labelCell=(label,hint,span=1)=>new D.TableCell({borders,columnSpan:span,shading:{type:D.ShadingType.CLEAR,color:"auto",fill:GREEN},width:{size:20,type:D.WidthType.PERCENTAGE},margins:{top:80,bottom:80,left:100,right:100},
    children:[new D.Paragraph({children:[new D.TextRun({text:label,bold:true,size:20})]}), ...(hint?[new D.Paragraph({children:[new D.TextRun({text:hint,italics:true,size:16,color:"55625A"})]})]:[])]});

  const sections=[];
  // Rows get a minimum height so each table fills its letter page the way the paper form does.

  // notes and confidentiality line use roughly 2600 of that on each page.

  for(const cf of list){

    const info=nextYearInfo(child, cf);

      ...SELF_CARE.map(r=>new D.Paragraph({spacing:{after:20},children:[new D.TextRun({text:r.label+"   ",bold:true,size:17}),...r.opts.map(([k,l])=>new D.TextRun({text:`${cf.selfCare?.[side]?.[r.k]?.[k]?"\u2612":"\u2610"} ${l}    `,size:17}))]})),
      new D.Paragraph({children:[new D.TextRun({text:"Notes   ",bold:true,size:17}),new D.TextRun({text:cf.selfCare?.[side+"Notes"]||"",size:17})]})]})]);
    const PAGE1=(info? 9900 : 10700)-SCW, unit=(PAGE1-2*META)/bodyRows.reduce((s,r)=>s+r.w,0);
    const rows=[

      ...bodyRows.flatMap(r=>[row(unit*r.w, r.cells), ...(r.sc? [scRow("school")] : [])])];

    const title=(t,brk)=>new D.Paragraph({spacing:{after:120},pageBreakBefore:!!brk,children:[new D.TextRun({text:t,bold:true,size:30,font:"Georgia"})]});
    const conf=(t)=>new D.Paragraph({spacing:{before:160},children:[new D.TextRun({text:t,italics:true,size:16})]});

    sections.push({properties:{page:{margin:{top:720,bottom:720,left:720,right:720}}},children:[
      new D.Paragraph({children:[new D.TextRun({text:"Fulton Community School & Farm",size:18,color:"55625A"})]}),
      title(`Family Conference · ${confLabel(cf)}`),

          new D.Paragraph({children:[new D.TextRun({text:info.text+" ",bold:true,size:19}),new D.TextRun({text:info.more,size:19})]}),
          new D.Paragraph({spacing:{before:60},children:[new D.TextRun({text:"Family's plan   ",bold:true,size:18}),...PLAN_BOXES.map(([v,l])=>new D.TextRun({text:`${info.plan===v?"\u2612":"\u2610"} ${l}     `,size:18}))]})]})]})]}), new D.Paragraph({spacing:{after:60},children:[]})] : []),

      new D.Table({width:{size:100,type:D.WidthType.PERCENTAGE},rows}),
      conf(CONF),

      for(let word of para.split(/\s+/).filter(Boolean)){ while(font.widthOfTextAtSize(word,size)>width){ let k=word.length-1; while(k>1&&font.widthOfTextAtSize(word.slice(0,k),size)>width) k--; if(line){ out.push(line); line=""; } out.push(word.slice(0,k)); word=word.slice(k); }
        const t=line? line+" "+word : word; if(font.widthOfTextAtSize(t,size)<=width) line=t; else { out.push(line); line=word; } }
      out.push(line); }
    while(out.length&&out[out.length-1]==="") out.pop(); return out; };
  const lines=(pg,ls,x,y,font,size,color=INK,lh=1.2)=>{ ls.forEach((l,n)=>pg.drawText(l,{x,y:y-size-(n*size*lh),size,font,color})); return ls.length*size*lh; };
  const fit=(pg,text,x,top,w,h,max=9.5,min=5.5)=>{ if(!String(text||"").trim()) return; let size=max, ls;
    for(;size>=min;size=+(size-.5).toFixed(1)){ ls=wrap(text,F.r,size,w); if(ls.length*size*1.2<=h) break; }
    if(size<min){ size=min; ls=wrap(text,F.r,size,w); const cap=Math.max(1,Math.floor(h/(size*1.2))); if(ls.length>cap){ ls=ls.slice(0,cap); const more=" (more in the app)"; let last=ls[cap-1]; while(last && F.r.widthOfTextAtSize(last+more,size)>w) last=last.slice(0,-1); ls[cap-1]=last.trimEnd()+more; } }
    lines(pg,ls,x,top,F.r,size); };

  const label=(pg,x,top,w,h,lab,hint)=>{ box(pg,x,top,w,h,GREEN); let ls=wrap(lab,F.b,8.5,w-10), sz=8.5; if(!hint && ls.length*10.2>h-6){ sz=7; ls=wrap(lab,F.b,sz,w-10); } let used=lines(pg,ls,x+5,top-(ls.length>1&&!hint?2:4),F.b,sz,INK,1.1);
    if(hint){ let hs=6.5, hl=wrap(hint,F.i,hs,w-10); const room=h-used-9; while(hl.length*hs*1.2>room && hs>5.5){ hs-=.5; hl=wrap(hint,F.i,hs,w-10); } hl=hl.slice(0,Math.max(0,Math.floor(room/(hs*1.2)))); lines(pg,hl,x+5,top-6-used,F.i,hs,GRAY); } };

    const pair=(top,h,l1,v1,l2,v2,hint1,hint2)=>{ label(pg,M,top,LW,h,l1,hint1); value(pg,M+LW,top,VW,h,v1); label(pg,M+LW+VW,top,LW,h,l2,hint2); value(pg,M+2*LW+VW,top,VW,h,v2); };
    pair(y,META,"Date",fmtDate(cf.confDate),"Child",childName(c)); y-=META;
    pair(y,META,"Birthdate",fmtDate(c?.dob),"Age",ageAt(c?.dob,cf.confDate||undefined)); y-=META;

      y-=h; if(r.b?.k==="expressive"){ selfCare(pg,y,cf,"school"); y-=SC_H; } }
    footer(pg);
    // page two
    pg=doc.addPage([W,H]); y=H-M;
    pg.drawText("Fulton Community School & Farm",{x:M,y:y-8,size:8,font:F.r,color:GRAY}); y-=12;
    pg.drawText("Family Reflections",{x:M,y:y-17,size:17,font:F.t,color:INK}); y-=25;
    y-=lines(pg,wrap("Completed together with the family during the conference. These questions build on the Family Questionnaire and focus on what has grown and changed since the start of the year.",F.r,8.5,TW),M,y,F.r,8.5,GRAY)+6;
    pair(y,META,"Child",childName(c),"Family Members Present",cf.familyPresent); y-=META;
    label(pg,M,y,LW,META,"Date"); value(pg,M+LW,y,TW-LW,META,fmtDate(cf.reflDate||cf.confDate)); y-=META;

    const qh=(y-M)/REFLECTIONS.length;

const PDFJS="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
const PDFJS_WORKER="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
async function loadPdfjs(){ await loadScript(PDFJS); await loadScript(PDFJS_WORKER); return window.pdfjsLib; }
async function readPdf(file, {maxImagePages=4}={}){
  const lib=await loadPdfjs();
  const doc=await lib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;
  let text=""; const pages=[], pageTexts=[], pageImgs=[];
  const IMG=new Set([lib.OPS.paintImageXObject, lib.OPS.paintJpegXObject, lib.OPS.paintInlineImageXObject].filter(x=>x!=null));
  for(let p=1;p<=doc.numPages;p++){ const pg=await doc.getPage(p); const vp=pg.getViewport({scale:1}); const tc=await pg.getTextContent();
    try{ const ops=await pg.getOperatorList(); pageImgs.push(ops.fnArray.some(f=>IMG.has(f))); }catch(e){ pageImgs.push(false); }
    pages.push({width:vp.width,items:tc.items.map(i=>({str:i.str,x:i.transform[4],y:vp.height-i.transform[5]}))});
    const t = tc.items.map(i=>i.str+(i.hasEOL?"\n":" ")).join(""); pageTexts.push(t); text += t+"\n\n"; }
  return {doc, text, pages, pageTexts, pageImgs};
}
async function pdfToImages(doc, max=4){
  const out=[];
  for(let p=1;p<=Math.min(doc.numPages,max);p++){ const pg=await doc.getPage(p); const vp0=pg.getViewport({scale:1}); const scale=Math.min(2.2, 1700/vp0.width); const vp=pg.getViewport({scale});
    const cv=document.createElement("canvas"); cv.width=vp.width; cv.height=vp.height; const ctx=cv.getContext("2d"); ctx.fillStyle="#fff"; ctx.fillRect(0,0,cv.width,cv.height);
    await pg.render({canvasContext:ctx,viewport:vp}).promise; out.push(await new Promise(r=>cv.toBlob(r,"image/jpeg",.88))); }
  return out;
}
async function pageImage(doc, p, width=1700){
  const pg=await doc.getPage(p); const vp0=pg.getViewport({scale:1}); const vp=pg.getViewport({scale:Math.min(2.2, width/vp0.width)});
  const cv=document.createElement("canvas"); cv.width=vp.width; cv.height=vp.height; const c=cv.getContext("2d"); c.fillStyle="#fff"; c.fillRect(0,0,cv.width,cv.height);
  await pg.render({canvasContext:c,viewport:vp}).promise; return await new Promise(r=>cv.toBlob(r,"image/jpeg",.86));
}
async function shrinkImage(blob, width=900){
  const bmp=await createImageBitmap(blob); const s=Math.min(1,width/Math.max(bmp.width,bmp.height));
  const cv=document.createElement("canvas"); cv.width=Math.round(bmp.width*s); cv.height=Math.round(bmp.height*s); cv.getContext("2d").drawImage(bmp,0,0,cv.width,cv.height);
  return await new Promise(r=>cv.toBlob(r,"image/jpeg",.8));
}
async function readDocx(file){
  await loadScript("https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js");
  const r=await window.mammoth.convertToHtml({arrayBuffer:await file.arrayBuffer()});
  const div=document.createElement("div"); div.innerHTML=r.value;
  $$("td,th",div).forEach(td=>td.append(" | ")); $$("tr,p,li,h1,h2,h3",div).forEach(el=>el.append("\n"));
  return div.textContent.replace(/\n{3,}/g,"\n\n");
}
async function normalizeImage(file, limits){
  const okTypes=limits?.images?.mediaTypes||["image/jpeg","image/png","image/webp","image/gif"];
  const maxB=limits?.images?.maxInputBytes||20e6;
  if(okTypes.includes(file.type) && file.size<=maxB && file.size<8e6) return file;
  let bmp; try{ bmp=await createImageBitmap(file); }catch(e){ throw new Error("This photo format cannot be read here. Save or export it as a JPEG or PNG, then upload it again."); }
  const s=Math.min(1, 2400/Math.max(bmp.width,bmp.height)); const cv=document.createElement("canvas"); cv.width=Math.round(bmp.width*s); cv.height=Math.round(bmp.height*s);
  cv.getContext("2d").drawImage(bmp,0,0,cv.width,cv.height); return await new Promise(r=>cv.toBlob(r,"image/jpeg",.9));
}

function extractionPrompt(text){
  const keys = FIELDS.map(f=>`  "${f.k}": section "${f.label}" (${f.hint||"free text"})`).join("\n");
  const refs = REFLECTIONS.map((r,i)=>`  "${r.k}": question ${i+1}, "${r.q}"`).join("\n");
  return `You are reading a completed Family Conference form from Fulton Community School & Farm, a preschool. The form may be handwritten, typed, photographed, scanned, or converted from a Word document. Transcribe what is written in each section of the form.

Rules
- Copy the writer's words faithfully. Keep their wording, spelling of names, and line breaks between separate thoughts. Do not summarize, rewrite, or add anything.
- Use an empty string for any section that is blank or missing.
- If a word cannot be read, write [illegible] in its place.
- Text printed on the blank template (section titles and the italic prompts under them) is not an answer. Leave it out.
- The form may be an older version from a previous school year, with different section names, a different order, or fewer or extra sections. Put each answer into the current section that matches it in meaning. For example, Social Development goes in social, Interests goes in interests, Goals goes in goals, and questions the family answered go in the closest reflection question.
- Never drop writing. Anything that fits no current section goes in otherSections, each piece starting with the original section title, like "Self-help skills. Uses the bathroom on her own." with a blank line between pieces.
- Two older layouts are common. Map them this way. Child's Learning Style goes in approaches. Friends or Interacts with most goes in friends. Main interests goes in interests. Favorite Area and Activity goes in favoriteAreas. Strengths goes in strengths. Goals, Areas to explore further, and any At school or At home goals go in goals, keeping the words At school and At home in front of each part. Questions the family asked go in r6. Updates the family shared about home go in r1. Parent names written at the top, like Mom and Dad, go in familyMembersPresent and parentNames.
- Notes written in the margins or outside the boxes go in otherSections, starting with Margin notes. Only include notes that carry meaning about the child or family. Leave out anything already captured elsewhere, such as parent names, times, ages, dates and page numbers. Leave out printed headings, stray single letters or symbols, and descriptions of where something was written.
- Self-Care at School and Self-Care at Home are tick boxes for Toileting, Eating and Rest. List the exact labels of the ticked boxes in selfCareSchool and selfCareHome, choosing only from ${SELF_CARE.flatMap(r=>r.opts.map(o=>o[1])).join(", ")}. Put any writing on their Notes lines in selfCareSchoolNotes and selfCareHomeNotes. Older forms without these boxes leave them empty.
- Often more than one educator holds the conference. Put every educator name written on the form in teacher, separated by commas.
- The Date box sometimes holds only a time, like 3:30 or 9:00. Put that in conferenceTime, not the date.
- Ages are often written next to the birthdate, like 3y 6m. Report that age in months in ageMonths, so 3y 6m is 42.
- If a section on the form clearly holds two current areas, such as Language and Cognition together, put the text in the first one and say so in notes.
- Dates as YYYY-MM-DD only when the year is written on the form. Otherwise copy the date exactly as written, and also fill conferenceMonth, conferenceDay and conferenceYear with numbers for whatever parts are written, leaving the rest null. Never guess a year. Times as HH:MM in 24-hour time.

Reply with only one JSON object in this exact shape
{
 "childName": "",
 "birthdate": "",
 "conferenceDate": "",
 "conferenceTime": "",
 "teacher": "",
 "familyMembersPresent": "",
 "reflectionsDate": "",
 "fields": { ${FIELDS.map(f=>`"${f.k}": ""`).join(", ")} },
 "reflections": { ${REFLECTIONS.map(r=>`"${r.k}": ""`).join(", ")} },
 "selfCareSchool": [],
 "selfCareSchoolNotes": "",
 "selfCareHome": [],
 "selfCareHomeNotes": "",
 "readability": "clear | partly unclear | hard to read",
 "otherSections": "",
 "conferenceMonth": null,
 "conferenceDay": null,
 "conferenceYear": null,
 "ageMonths": null,
 "parentNames": "",
 "formVersion": "current template | older version",
 "notes": "anything the reviewer should double-check, including how older sections were matched"
}

Where each key comes from on the form
${keys}
Family Reflections page
${refs}
${text? "\n\nThe document text follows, extracted from the file. Table cells are separated by | characters.\n\n<<<\n"+text.slice(0,120000)+"\n>>>" : "\n\nThe form is in the attached image(s), in page order."}`;
}
function bestChildMatch(name, dob, parents){
  const norm=s=>String(s||"").toLowerCase().normalize("NFKD").replace(/[^a-z ]/g," ").replace(/\s+/g," ").trim();
  const n=norm(name); if(!n && !dob) return null;
  const toks=n.split(" ").filter(Boolean);
  const ptoks=norm(parents).split(" ").filter(t=>t.length>2 && !["mom","dad","mother","father"].includes(t));
  const kids=Object.values(S.children);
  // a short name like Che counts when it starts exactly one child's first name
  const firstTok=toks[0]||""; const prefixHits=firstTok.length>=3? kids.filter(c=>norm(c.first).startsWith(firstTok)) : [];
  let best=null, bs=0, second=0;
  for(const c of kids){
    const cn=norm(childName(c)); const ct=cn.split(" ");
    let s=0; if(cn===n) s+=10;
    toks.forEach(t=>{ if(ct.includes(t)) s+=3; else if(t.length>2 && ct.some(x=>x.startsWith(t)||t.startsWith(x))) s+=1; });
    if(prefixHits.length===1 && prefixHits[0]===c && !ct.includes(firstTok)) s+=2;
    const d=toISODate(dob); if(d && c.dob===d) s+=5;
    const pn=norm((c.parents||[]).map(p=>p.name).join(" ")).split(" ");
    ptoks.forEach(t=>{ if(pn.includes(t)) s+=2; });
    if(c.status==="withdrawn") s-=.5;
    if(s>bs){ second=bs; bs=s; best=c; } else if(s>second) second=s;
  }
  return bs>=3 && bs>second? best : null;
}

async function runImport(file, opt={}){
  const ctx=S.importCtx; ctx.file=file; ctx.careful=!!opt.careful;
  const busy=t=>impStatus(`<div class="progress-note"><span class="spinner"></span><span>${esc(t)}</span><button class="btn sm" style="margin-left:auto" data-act="close">Stop</button></div>`);
  if(!S.sample){ impStatus(`<div class="notice">Reading forms needs Claude, which is not available in this view. You can still attach the file to a conference from its Original forms panel.</div>`); return; }
  const ctl=new AbortController(); S.modalCtl=ctl;
  try{
    busy("Opening "+file.name+"…");
    let text="", images=[];
    const limits=await S.sample.limits().catch(()=>null);
    const name=file.name.toLowerCase();
    if(file.type==="application/pdf"||name.endsWith(".pdf")){
      const r=await readPdf(file); const real=r.text.replace(/\s+/g," ").trim();
      if(real.length>200 && !r.pageImgs.some(Boolean)) text=r.text; else { busy("Turning scanned pages into images…"); images=await pdfToImages(r.doc, limits?.images?.maxCount? Math.min(4,limits.images.maxCount):4); }
    } else if(name.endsWith(".docx")){ text=await readDocx(file); }
    else if(name.endsWith(".doc")){ throw new Error("Older .doc files cannot be read here. Open it in Word and save it as .docx or PDF, then upload that."); }
    else if(file.type.startsWith("image/")||/\.(heic|heif)$/.test(name)){ images=[await normalizeImage(file, limits)]; ctx.keepBlob = images[0]!==file ? images[0] : null; }
    else if(file.type.startsWith("text/")){ text=await file.text(); }
    else throw new Error("This file type cannot be read. Upload a photo, PDF, or DOCX.");
    if(images.length && !limits?.images){ throw new Error("Reading photos is not available in this view. Upload the Word or PDF version instead."); }
    busy(images.length? "Claude is reading the handwriting. This can take up to a minute…" : "Claude is reading the form…");
    const res=await S.sample.json(extractionPrompt(text), {signal:ctl.signal, ...(images.length?{images}:{}), modelTier:"default", ...(opt.careful?{careful:true}:{})});
    if(!res || typeof res!=="object") throw new Error("The form could not be read. Try a clearer photo.");
    ctx.result=res; showReview();
  }catch(e){
    if(e?.code==="cancelled") return;
    const msg = e?.code==="not_granted"? "Claude was not allowed for this page, so the form could not be read."
      : e?.code==="rate_limited"? "Claude is busy right now. Wait a minute and try again."
      : e?.code==="image_rejected"? "That image could not be used. Try a smaller JPEG or PNG."
      : e?.code==="invalid_json"? "The reply could not be turned into form sections. Try again, or try a clearer photo."
      : e?.code==="refused"? "Claude could not read this file. Check that it is a conference form."
      : e?.code? "The form could not be read this time. Try again in a moment."
      : (e?.message||"The form could not be read.");
    impStatus(`<div class="notice">${esc(msg)}</div>`);
  }
}
