      const cur=(getPath(target,path)||"").trim();
      let out=val;
      if((path==="confDate"||path==="reflDate")){ out=toISODate(val); if(!out) return; }
      if(path==="confTime"){ out=parseTime(val); if(!out) return; }
      const single=["confDate","reflDate","confTime"].includes(path);
      // when the reviewer could not see what was already saved, never replace it silently
      const effective = (!ctx.confId && cur && mode==="replace" && !single)? "append" : mode;
      if(single && cur && effective!=="replace") return;
      if(effective==="append" && cur && (path==="teacher"||path==="familyPresent")){ const names=[...new Set([...cur.split(/\s*[,\n]\s*/),...val.split(/\s*[,\n]\s*/)].map(s=>s.trim()).filter(Boolean))]; out=names.join(", "); if(out===cur) return; }
      else if(effective==="append" && cur){ if(cur.includes(val)) return; out=cur+"\n\n"+val; }
      setPath(patch,path,out);
    });
    if($("#rv-keep")?.checked && S.assets && ctx.file){
      const keep = ctx.keepBlob || ctx.file;
      if(/\.docx$/i.test(ctx.file.name)) toast("Sections saved. Word files cannot be kept as originals, so save it as PDF if you want it attached.");
      else try{ const up=await S.assets.upload(keep); patch.attachments=[...(target.attachments||[]), {id:up.id,name:ctx.file.name,type:up.contentType||keep.type,at:nowISO(),...(S.uid?{by:S.uid}:{})}]; }
      catch(e){ toast("Sections saved. The original file could not be kept with the conference."); }
    }
    scFromTicks(patch);
    patch.updatedAt=nowISO(); if(S.uid) patch.updatedBy=S.uid; patch.importedFrom=ctx.file?.name||"";
    await dbUpdate("conferences/"+confId, patch);
    closeModal(); toast("Form sections saved"); go("conf",{id:confId});
  }catch(e){ btn.disabled=false; btn.textContent="Save to conference"; }
}
/* ---------- batch: many forms in one PDF or several photos ---------- */
function pageKindFromText(t){
  if(/Main\s+Interests|Conference\s+Date\s+and\s+Time|Small\s+Group\s+Work\s+and\s+Current\s+Inquiry/i.test(t)) return "conference";
  if(/Family\s+Reflections/i.test(t) || /What are you noticing about your child at home/i.test(t)) return "reflections";
  return t.replace(/\s/g,"").length>40? "continuation" : "other";
}
function namesCompatible(a,b){
  const tok=s=>String(s||"").toLowerCase().replace(/[^a-z ]/g," ").split(/\s+/).filter(x=>x.length>1);
  const A=tok(a), B=tok(b); if(!A.length||!B.length) return true;
  return A.some(x=>B.some(y=>x===y||x.startsWith(y)||y.startsWith(x)));
}
function groupPages(infos){
  const forms=[], skipped=[]; let cur=null;
  const start=(p,refl)=>{ cur={pages:[p.n], name:p.childName||"", hasRefl:refl}; forms.push(cur); };
  for(const p of infos){
    if(p.kind==="conference") start(p,false);
    else if(p.kind==="reflections"){
      if(cur && !cur.hasRefl && namesCompatible(cur.name,p.childName)){ cur.pages.push(p.n); cur.hasRefl=true; if(!cur.name) cur.name=p.childName||""; }
      else start(p,true);
    }
    else if(p.kind==="continuation"){ if(cur) cur.pages.push(p.n); else start(p,false); }
    else skipped.push(p.n);
  }
  return {forms, skipped};
}
function pageRange(pages){ return pages.length===1? `Page ${pages[0]}` : `Pages ${pages[0]} to ${pages[pages.length-1]}`; }

async function runBatch(files, preread){
  const ctx=S.importCtx; const ctl=new AbortController(); S.modalCtl=ctl;
  const busy=t=>impStatus(`<div class="progress-note"><span class="spinner"></span><span>${esc(t)}</span><button class="btn sm" style="margin-left:auto" data-act="close">Stop</button></div>`);
  if(!S.sample){ impStatus(`<div class="notice">Reading forms needs Claude, which is not available in this view.</div>`); return; }
  const limits=await S.sample.limits().catch(()=>null);
  const maxImg=Math.max(1, Math.min(limits?.images?.maxCount||4, 8));
  const B={source:files.length===1?files[0].name:`${files.length} photos`, pdf:null, file:files.length===1?files[0]:null, pages:[], forms:[], skipped:[]};
  ctx.batch=B;
  try{
    /* 1. pages */
    if(preread){
      B.pdf=preread.doc;
      preread.pageTexts.forEach((t,i)=>B.pages.push({n:i+1, text:t, hasText:t.replace(/\s/g,"").length>150 && !preread.pageImgs[i]}));
    } else {
      for(let i=0;i<files.length;i++){ busy(`Preparing photo ${i+1} of ${files.length}…`); B.pages.push({n:i+1, text:"", hasText:false, blob:await normalizeImage(files[i], limits), name:files[i].name}); }
    }
    const scanned = B.pages.some(p=>!p.hasText);
    if(scanned && !limits?.images) throw new Error("Reading scanned pages or photos is not available in this view. Upload a typed PDF instead.");
    const imgOf = async (p, width=1700)=>{ if(p.blob) return width<1700? shrinkImage(p.blob,width) : p.blob; return pageImage(B.pdf, p.n, width); };

    /* 2. find where each form starts and ends */
    const sortPrompt=(first,last,count,how)=>`These ${count} ${how} pages ${first} to ${last}, in order, from a stack of completed Family Conference forms at a preschool. Forms come from different school years, so the layout, titles and section names vary. The current version has a first page titled Family Conference, with Conference Date and Time, Teacher or Educator, and development areas starting with Main Interests and Friends, and a second page titled Family Reflections with six numbered questions for the family. Older versions may use other titles, other section names, a single page, or questions for the family on the same page.
For each page decide its kind.
- conference means the first page of a form for one child, whatever the version.
- reflections means a page of questions answered with the family that belongs with the form before it.
- continuation means any other page that continues the form before it.
- other means a page that is not part of any form, such as a blank page or a cover sheet.
Also give the child's name written on the page, or an empty string when none appears.
Reply with only JSON in this shape
{"pages":[{"page":${first},"kind":"conference | reflections | continuation | other","childName":""}]}`;
    const KINDS=["conference","reflections","continuation","other"];
    const take=(chunk,r,infos)=>chunk.forEach((p,k)=>{ const hit=(r?.pages||[]).find(x=>+x.page===p.n) || (r?.pages||[])[k] || {}; infos.push({n:p.n, kind:KINDS.includes(hit.kind)?hit.kind:"continuation", childName:String(hit.childName||"")}); });
    let infos;
    if(!scanned){
      infos=B.pages.map(p=>({n:p.n, kind:pageKindFromText(p.text), childName:""}));
      const trial=groupPages(infos);
      // the page titles did not match the current template, so this is likely an older version; let Claude sort the pages by reading them
      if(!infos.some(x=>x.kind==="conference") || trial.forms.some(f=>f.pages.length>4) || trial.skipped.length){
        infos=[];
        for(let i=0;i<B.pages.length;i+=12){
          const chunk=B.pages.slice(i,i+12);
          busy(`Sorting pages ${chunk[0].n} to ${chunk.at(-1).n} of ${B.pages.length}…`);
          const body=chunk.map(p=>`--- Page ${p.n} ---\n${p.text.replace(/\s+/g," ").slice(0,900)}`).join("\n\n");
          try{ take(chunk, await S.sample.json(sortPrompt(chunk[0].n,chunk.at(-1).n,chunk.length,"excerpts below are the text of")+"\n\n"+body, {modelTier:"quick", signal:ctl.signal}), infos); }
          catch(e){ if(e?.code==="cancelled") throw e; chunk.forEach(p=>infos.push({n:p.n, kind:pageKindFromText(p.text)==="other"?"other":(p.n%2===1?"conference":"reflections"), childName:"", guessed:true})); }
        }
      }
    }
    else {
      infos=[];
      for(let i=0;i<B.pages.length;i+=maxImg){
        const chunk=B.pages.slice(i,i+maxImg);
        busy(`Sorting pages ${chunk[0].n} to ${chunk.at(-1).n} of ${B.pages.length}…`);
        const imgs=[]; for(const p of chunk) imgs.push(await imgOf(p, 900));
        try{ take(chunk, await S.sample.json(sortPrompt(chunk[0].n,chunk.at(-1).n,chunk.length,"images are"), {images:imgs, modelTier:"quick", signal:ctl.signal}), infos); }
        catch(e){ if(e?.code==="cancelled") throw e; chunk.forEach(p=>infos.push({n:p.n, kind:(p.n%2===1)?"conference":"reflections", childName:"", guessed:true})); }
      }
    }
    if(!infos.some(x=>x.kind==="conference")) infos=infos.map(x=>({...x, kind:x.kind==="other"?"other":(x.n%2===1?"conference":"reflections"), guessed:true}));
    const g=groupPages(infos); B.skipped=g.skipped;
    B.forms=g.forms.map((f,i)=>({i, pages:f.pages, nameHint:f.name, state:"waiting", result:null, error:"", include:true, childId:"", year:"", term:"", edits:{}, guessed:infos.some(x=>x.guessed)}));
    if(!B.forms.length) throw new Error("No conference forms were found in this upload.");

    /* 3. read each form on its own */
    let done=0;
    const readOne = async (F)=>{
      F.state="reading"; busy(`Reading form ${done+1} of ${B.forms.length} (${pageRange(F.pages)})…`);
      try{
        const ps=F.pages.map(n=>B.pages[n-1]);
        let res;
        if(!scanned){ res=await S.sample.json(extractionPrompt(ps.map(p=>p.text).join("\n\n")), {signal:S.modalCtl.signal, modelTier:"default", ...(F.careful?{careful:true}:{})}); }
        else { const imgs=[]; for(const p of ps.slice(0,maxImg)) imgs.push(await imgOf(p)); res=await S.sample.json(extractionPrompt(""), {images:imgs, signal:S.modalCtl.signal, modelTier:"default", ...(F.careful?{careful:true}:{})}); }
        if(!res||typeof res!=="object") throw {code:"invalid_json"};
        F.result=res; F.state="read";
        const m=bestChildMatch(res.childName||F.nameHint, res.birthdate, res.parentNames||res.familyMembersPresent); F.childId=m?.id||"";
        const pd=inferSeason(res, m); F.year=pd.year; F.term=pd.term; F.date=pd.date; F.how=pd.how;
      }catch(e){ if(e?.code==="cancelled") throw e; F.state="failed"; F.include=false; F.error=readErr(e); }
      done++;
    };
    for(const F of B.forms) await readOne(F);
    ctx.readOne=readOne; ctx.scanned=scanned;
    ctx.resplit=async(per)=>{
      const ctl2=new AbortController(); S.modalCtl=ctl2; done=0;
      const nums=B.pages.map(p=>p.n).filter(n=>!B.skipped.includes(n));
      B.forms=[]; for(let i=0;i<nums.length;i+=per) B.forms.push({i:B.forms.length, pages:nums.slice(i,i+per), nameHint:"", state:"waiting", result:null, error:"", include:true, childId:"", year:"", term:"", edits:{}, guessed:false, manual:per});
      try{ for(const F of B.forms) await readOne(F); }catch(e){ if(e?.code==="cancelled") return; }
      showBatchReview();
    };
    showBatchReview();
  }catch(e){
    if(e?.code==="cancelled") return;
    impStatus(`<div class="notice">${esc(e?.message || readErr(e))}</div>`);
  }
}
function readErr(e){
  return e?.code==="not_granted"? "Claude was not allowed for this page."
    : e?.code==="rate_limited"? "Claude is busy. Wait a minute and try this form again."
    : e?.code==="image_rejected"? "These pages could not be used as images."
    : e?.code==="invalid_json"? "The reply could not be turned into form sections."
    : e?.code==="refused"? "Claude could not read these pages."
    : (e?.message || "This form could not be read this time.");
}
function batchConflicts(){
  const B=S.importCtx.batch, seen={};
  B.forms.forEach(F=>{ if(F.include && F.childId && F.term!=="Additional"){ const k=F.childId+"|"+(F.term==="Historical"?"":F.year)+"|"+F.term; (seen[k]=seen[k]||[]).push(F.i); } });
  return seen;
}
function showBatchReview(){
  const ctx=S.importCtx, B=ctx.batch;
  const kids=Object.values(S.children).sort((a,b)=>childName(a).localeCompare(childName(b)));
  const yrs=[...new Set([...(S.settings.years||[]), S.period.year, ...B.forms.map(F=>F.year).filter(Boolean)])].sort();
  const seasonOpts=F=>`<option value="|Historical" ${F.term==="Historical"?"selected":""}>Earlier, date unknown</option>`+yrs.flatMap(y=>["Fall","Spring","Additional"].map(t=>`<option value="${y}|${t}" ${F.year===y&&F.term===t?"selected":""}>${t} ${y}</option>`)).join("");
  const conf=batchConflicts();
  const read=B.forms.filter(F=>F.state==="read").length, matched=B.forms.filter(F=>F.state==="read"&&F.childId).length;
  const row=F=>{
    const r=F.result||{}; const filled=F.result? filledCount({fields:r.fields||{},reflections:r.reflections||{}}) : 0;
    const k=F.childId+"|"+(F.term==="Historical"?"":F.year)+"|"+F.term; const group=(conf[k]||[]); const firstI=group[0];
    const combined = F.include && F.childId && group.length>1 && firstI!==F.i ? B.forms[firstI] : null;
    const existing = F.childId ? findConf(F.childId, F.year, F.term) : null;
    const note = F.state==="failed"? `<span style="color:var(--danger)">${esc(F.error)}</span> <button class="btn sm" data-act="batch-retry" data-i="${F.i}">Try again</button>`
      : !F.childId? `<span style="color:var(--danger)">Choose the child</span>`
      : (combined? `Combined with ${esc(pageRange(combined.pages).toLowerCase())}. Repeated text is left out.`
        : existing? (F.term==="Historical"? "Adds to earlier conferences" : hasWork(existing)?"Adds to the existing conference":"Fills the started conference")
        : F.term==="Historical"? "Starts the earlier conferences record" : "Starts a new conference")
        + (seasonNote(F.how)? `<div class="muted">${esc(seasonNote(F.how))}</div>` : "");
    return `<tr data-i="${F.i}">
      <td><input type="checkbox" aria-label="Include this form" data-b="include" ${F.include?"checked":""} ${F.state!=="read"?"disabled":""}></td>
      <td class="small mono" style="white-space:nowrap">${esc(pageRange(F.pages).replace("Pages ","").replace("Page ",""))}</td>
      <td class="small">${esc(r.childName||F.nameHint||"No name found")}${r.readability?`<div class="muted">${esc(r.readability)}${/older/i.test(r.formVersion||"")?", older form":""}</div>`:""}</td>
      <td><select aria-label="Child" data-b="child" ${F.state!=="read"?"disabled":""}><option value="">Choose a child</option>${kids.map(c=>`<option value="${esc(c.id)}" ${F.childId===c.id?"selected":""}>${esc(childName(c))}${c.classroom?" · "+esc(c.classroom):""}</option>`).join("")}</select></td>
      <td><select aria-label="Season" data-b="season" ${F.state!=="read"?"disabled":""}>${seasonOpts(F)}</select></td>
      <td class="small mono">${F.result? filled+"/"+TOTAL_FIELDS : ""}</td>
      <td class="small">${note}</td>
      <td><div class="stack" style="gap:6px">${F.state==="read"?`<button class="btn sm" data-act="batch-check" data-i="${F.i}">Check</button>`:""}${window.CAREFUL_READ && F.state==="read" && !F.careful?`<button class="btn sm ghost" data-act="batch-careful" data-i="${F.i}" title="Uses a stronger model for hard handwriting">Read carefully</button>`:""}</div></td>
    </tr><tr class="batch-detail" data-detail="${F.i}" hidden><td colspan="8"></td></tr>`; };
  impStatus(`
    <div class="notice" style="margin-bottom:10px"><b>${B.forms.length} ${B.forms.length===1?"form":"forms"} found in ${B.pages.length} pages.</b> ${read} read, ${matched} matched to a child.${B.skipped.length?` Skipped ${B.skipped.length===1?"page":"pages"} ${B.skipped.join(", ")} because ${B.skipped.length===1?"it does":"they do"} not look like part of a form.`:""}${B.forms[0]?.guessed?" Some pages could not be sorted automatically, so forms were assumed to be two pages each. Check the page ranges.":""} Check each child and season before saving. Forms for the same child and season are combined into one conference, and copies of the same form are not repeated. When the date is unclear, the form is kept with that child's earlier conferences.</div>
    <div class="row small" style="margin-bottom:10px"><span class="muted">Pages split wrong?</span><label for="bt-per" class="muted">Read again with</label><select id="bt-per">${[1,2,3,4].map(n=>`<option value="${n}" ${B.forms[0]?.manual===n?"selected":""}>${n} ${n===1?"page":"pages"} per form</option>`).join("")}</select><button class="btn sm" data-act="batch-resplit">Read again</button></div>
    <div class="tbl-wrap"><table class="list" id="batch-table"><thead><tr><th></th><th>Pages</th><th>Form says</th><th>Child</th><th>Season</th><th>Filled</th><th>What happens</th><th></th></tr></thead><tbody>${B.forms.map(row).join("")}</tbody></table></div>
    <label class="check" ${S.assets?"":"hidden"}><input type="checkbox" id="bt-keep" checked><span>Keep each child's original pages with their conference</span></label>
    <div class="modal-foot"><button class="btn" data-act="close">Cancel</button><button class="btn primary" id="bt-save">Save checked forms</button></div>`);
  const tb=$("#batch-table");
  tb.addEventListener("change", e=>{
    const tr=e.target.closest("tr[data-i]"); if(!tr) return; const F=B.forms[+tr.dataset.i]; const k=e.target.dataset.b;
    if(k==="include") F.include=e.target.checked;
    if(k==="child"){ F.childId=e.target.value; if(!F.seasonTouched && F.result){ const pd=inferSeason(F.result, S.children[F.childId]); F.year=pd.year; F.term=pd.term; F.date=pd.date; F.how=pd.how; } }
    if(k==="season"){ const [y,t]=e.target.value.split("|"); F.year=y; F.term=t; F.seasonTouched=true; F.how=""; }
    if(k) { const open=$$("tr.batch-detail:not([hidden])").map(x=>x.dataset.detail); showBatchReview(); open.forEach(i=>toggleBatchDetail(+i,true)); }
  });
  tb.addEventListener("input", e=>{ const d=e.target.closest("tr[data-detail]"); if(d && e.target.dataset.path){ B.forms[+d.dataset.detail].edits[e.target.dataset.path]=e.target.value; } });
  $("#bt-save").onclick=saveBatch;

  openModal(`<h2>Mark ${list.length} ${list.length===1?"family":"families"} as no response?</h2>
    <p>Use this at the end of the ${esc(periodLabel(S.period))} season for families who never signed up. Families marked Rescheduling are left as they are. Their conferences will show "No response" and stop counting as not started. You can change any of them later from the conference page.</p>
    <p class="small muted">${esc(list.map(childName).join(", "))}</p>
    <div class="modal-foot"><button class="btn" data-act="close">Cancel</button><button class="btn primary" data-act="mark-noresponse-yes">Mark as no response</button></div>`);
};
actions["mark-noresponse-yes"]=async(btn)=>{
  btn.disabled=true; let n=0;
  for(const c of familiesToReach().filter(c=>periodConf(c.id)?.signup!=="rescheduling")){
    try{ let cf=periodConf(c.id); let id=cf?.id || await createConf(c.id, S.period.year, S.period.term); if(!id) continue;
      await dbUpdate("conferences/"+id,{signup:"noresponse", updatedAt:nowISO(), ...(S.uid?{updatedBy:S.uid}:{})}); n++; btn.textContent=`Marked ${n}…`; }catch(e){}
  }

};
actions["reread-careful"]=()=>{ const ctx=S.importCtx; if(!ctx?.file) return; ctx.careful=true; runImport(ctx.file,{careful:true}); };
actions["batch-careful"]=async a=>{ const ctx=S.importCtx, F=ctx.batch.forms[+a.dataset.i]; F.careful=true; F.edits={}; const ctl=new AbortController(); S.modalCtl=ctl; try{ await ctx.readOne(F); }catch(e){} showBatchReview(); };
actions["open-saved"]=a=>{ closeModal(); go("conf",{id:a.dataset.id}); };
function seasonSelectOptions(sel){
  const yrs=[...new Set([...(S.settings.years||[]), S.period.year, sel.year].filter(Boolean))].sort();
  return `<option value="|Historical" ${sel.term==="Historical"?"selected":""}>Earlier, date unknown</option>`+yrs.flatMap(y=>["Fall","Spring","Additional"].map(t=>`<option value="${y}|${t}" ${sel.year===y&&sel.term===t?"selected":""}>${t} ${y}</option>`)).join("");
}
actions["conf-move"]=()=>{
  const cf=S.confs[S.view.id]; if(!cf) return;
  const kids=Object.values(S.children).sort((a,b)=>childName(a).localeCompare(childName(b)));
  openModal(`<h2>Move this record</h2>
    <p class="small muted" style="margin:0">Use this when a form was matched to the wrong child or the wrong season. If the child already has a record for that season, the two are combined and repeated text is left out.</p>
    <div class="grid2">
      <div class="field"><label for="mv-child">Child</label><select id="mv-child">${kids.map(c=>`<option value="${esc(c.id)}" ${c.id===cf.childId?"selected":""}>${esc(childName(c))}${c.classroom?" · "+esc(c.classroom):""}</option>`).join("")}</select></div>
      <div class="field"><label for="mv-season">Season</label><select id="mv-season">${seasonSelectOptions({year:cf.schoolYear, term:cf.term})}</select></div>
    </div>
    <div class="modal-foot"><button class="btn" data-act="close">Cancel</button><button class="btn primary" data-act="conf-move-yes">Move record</button></div>`);
};
actions["conf-move-yes"]=async(btn)=>{
  await flushAll();
  const src=S.confs[S.view.id]; if(!src) return;
  const childId=$("#mv-child").value; const [year,term]=$("#mv-season").value.split("|");
  if(childId===src.childId && term===src.term && (term==="Historical"||year===src.schoolYear)){ closeModal(); return; }
  btn.disabled=true; btn.textContent="Moving…";
  try{
    let destId=findConf(childId,year,term)?.id;
    if(destId===src.id) destId=null;
    if(!destId) destId=await createConf(childId,year,term);
    if(!destId) throw new Error("create");
    const dest=S.confs[destId]||{}; const patch={};
    const singles=["confDate","confTime","format","teacher","familyPresent","reflDate","followUpDate","followUpNote"];
    const texts=[...FIELDS.map(f=>"fields."+f.k), ...REFLECTIONS.map(r=>"reflections."+r.k), "otherSections","prevGoalsProgress","staffNotes"];
    singles.forEach(k=>{ const v=src[k]; if(v && !dest[k]) patch[k]=v; });
    texts.forEach(k=>{ const v=getPath(src,k); if(!String(v||"").trim()) return; const cur=String(getPath(dest,k)||"").trim(); const out=mergeText(cur, v, cur? "From another form" : ""); if(out!==cur) setPath(patch,k,out); });
    Object.entries(src.prep||{}).forEach(([k,v])=>{ if(v) setPath(patch,"prep."+k,true); });
    for(const side of ["school","home"]){ for(const r of SELF_CARE) for(const [k] of r.opts) if(src.selfCare?.[side]?.[r.k]?.[k]) setPath(patch,`selfCare.${side}.${r.k}.${k}`,true);
      const n=src.selfCare?.[side+"Notes"]; if(n && !dest.selfCare?.[side+"Notes"]) setPath(patch,`selfCare.${side}Notes`,n); }
    if((src.attachments||[]).length) patch.attachments=[...(dest.attachments||[]), ...src.attachments];
    if(src.status==="complete" && term!=="Historical") patch.status="complete";
    patch.updatedAt=nowISO(); if(S.uid) patch.updatedBy=S.uid;
    await dbUpdate("conferences/"+destId, patch);
    pending.clear(); dirty.clear();
    await dbDelete("conferences/"+src.id);
    closeModal(); toast("Record moved"); go("conf",{id:destId});
  }catch(e){ btn.disabled=false; btn.textContent="Move record"; }
};
actions["batch-resplit"]=()=>{ const per=+$("#bt-per").value||2; S.importCtx.resplit?.(per); };
actions["batch-retry"]=async a=>{
  const ctx=S.importCtx, F=ctx.batch.forms[+a.dataset.i]; F.state="waiting"; F.error="";
  const ctl=new AbortController(); S.modalCtl=ctl;
  try{ await ctx.readOne(F); if(F.state==="read") F.include=true; }catch(e){}
  showBatchReview();
};
async function splitPdfPages(pages){
  await loadScript("https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js");
  const ctx=S.importCtx, B=ctx.batch;
  if(!B.srcPdf) B.srcPdf=await window.PDFLib.PDFDocument.load(await B.file.arrayBuffer(), {ignoreEncryption:true});
  const out=await window.PDFLib.PDFDocument.create();
  const copied=await out.copyPages(B.srcPdf, pages.map(n=>n-1)); copied.forEach(pg=>out.addPage(pg));
  return new Blob([await out.save()],{type:"application/pdf"});
}
async function saveBatch(){
  const ctx=S.importCtx, B=ctx.batch; const btn=$("#bt-save"); btn.disabled=true;
  const todo=B.forms.filter(F=>F.include&&F.state==="read"&&F.childId);
  const keep=$("#bt-keep")?.checked && S.assets;
  let saved=0, failed=[]; const savedList=[];
  for(const F of todo){
    btn.textContent=`Saving ${saved+1} of ${todo.length}…`;
    try{
      let confId = findConf(F.childId, F.year, F.term)?.id || null;
      if(!confId) confId=await createConf(F.childId, F.year, F.term);
      if(!confId) throw new Error("create");
      const target=structuredClone(S.confs[confId]||{}); const patch={};
      const hist=F.term==="Historical"; const r=F.result||{};
      const rawDate=String(r.conferenceDate||"").trim();
      const dateText = F.date? fmtDate(F.date) : rawDate && !/^\d{1,2}:\d{2}/.test(rawDate)? rawDate : "";
      for(const [path] of batchFieldList()){
        let val=String(batchValue(F,path)||"").trim(); if(!val && !(path==="confDate"&&F.date)) continue;
        const cur=String(getPath(target,path)||"").trim();
        if(path==="confDate"||path==="reflDate"){ if(hist) continue; val=toISODate(val)||(path==="confDate"?F.date:""); if(!val||cur) continue; }
        else if(path==="confTime"){ if(hist) continue; val=parseTime(val); if(!val||cur) continue; }
        else if(path==="teacher"){ if(cur){ const names=[...new Set([...cur.split(/,\s*/),val].filter(Boolean))]; val=names.join(", "); if(val===cur) continue; } }
        else if(path.startsWith("scTicks.")){ /* ticks are only ever added */ }
        else if(path==="familyPresent"){ if(cur){ if(containment(cur,val)>=0.8){ if(val===cur) continue; } else if(containment(val,cur)>=0.6) continue; else val=cur+"; "+val; } }
        else {
          const label = (hist||cur)? (dateText? `From the form dated ${dateText}` : (cur? "From another form" : "")) : "";
          val=mergeText(cur,val,label); if(val===cur) continue;
        }
        setPath(patch,path,val); setPath(target,path,val);
      }
      if(keep){
        try{
          const atts=[...(target.attachments||[])];
          if(B.file && B.pdf){ const blob=await splitPdfPages(F.pages); const up=await S.assets.upload(blob); atts.push({id:up.id,name:`${B.source.replace(/\.pdf$/i,"")} ${pageRange(F.pages).toLowerCase()}.pdf`,type:"application/pdf",at:nowISO(),...(S.uid?{by:S.uid}:{})}); }
          else for(const n of F.pages){ const p=B.pages[n-1]; const up=await S.assets.upload(p.blob); atts.push({id:up.id,name:p.name||`page-${n}.jpg`,type:up.contentType||p.blob.type,at:nowISO(),...(S.uid?{by:S.uid}:{})}); }
          patch.attachments=atts; target.attachments=atts;
        }catch(e){ console.warn(e); }
      }
      scFromTicks(patch); if(patch.selfCare) target.selfCare=deepMergeLocal(structuredClone(target.selfCare||{}), patch.selfCare);
      patch.updatedAt=nowISO(); if(S.uid) patch.updatedBy=S.uid; patch.importedFrom=B.source;
      await dbUpdate("conferences/"+confId, patch); saved++;
      if(!savedList.some(x=>x.id===confId)) savedList.push({id:confId, name:childName(S.children[F.childId]), label:confLabel(S.confs[confId]||{term:F.term,schoolYear:F.year})});
      S.confs[confId]={...target, id:confId, updatedAt:patch.updatedAt}; // so the next form for this child builds on this one
    }catch(e){ failed.push(childName(S.children[F.childId])); }
  }
  closeModal();
  savedList.sort((a,b)=>a.name.localeCompare(b.name));
  openModal(`<h2>${saved} ${saved===1?"form":"forms"} saved</h2>
    ${failed.length?`<div class="notice">Not saved for ${esc(failed.join(", "))}. Upload those pages again.</div>`:""}
    <p class="small muted" style="margin:0">They went into ${savedList.length} ${savedList.length===1?"record":"records"}. Open any of them to check the combined text.</p>
    <ul class="list-plain">${savedList.map(x=>`<li><span><b>${esc(x.name)}</b> <span class="muted small">${esc(x.label)}</span></span><button class="btn sm" data-act="open-saved" data-id="${esc(x.id)}">Open</button></li>`).join("")}</ul>
    <div class="modal-foot"><button class="btn primary" data-act="close">Done</button></div>`);
}

function openAttachOnly(){
  openModal(`<h2>Attach a file</h2><p class="small muted" style="margin:0">Keep a scan, photo, or document with this conference without reading it.</p>
  <label class="drop" for="att-file"><b>Choose a file</b><div class="small muted">A photo or PDF up to 15 MB</div></label><input type="file" id="att-file" hidden>
  <div id="att-status"></div><div class="modal-foot"><button class="btn" data-act="close">Done</button></div>`);
  $("#att-file").onchange=async e=>{ const f=e.target.files[0]; if(!f) return; $("#att-status").innerHTML=`<div class="progress-note"><span class="spinner"></span>Uploading…</div>`;

    catch(err){ $("#att-status").innerHTML=`<div class="notice">${err?.code==="unsupported_type"?"This file type cannot be stored. Upload an image, PDF, or text file. Word files can be saved as PDF first.":"The file could not be attached. Try again."}</div>`; } };

/* ---------- roster import from 1Core ---------- */
function parseRosterPages(pages){
  const norm=s=>s.replace(/\s+/g," ").trim(); const kids=[]; let cur=null;
  for(const pg of pages){
    const items=pg.items.filter(i=>i.str&&i.str.trim()).map(i=>({s:norm(i.str),x:i.x,y:i.y})); const mid=pg.width/2;
    const rowVal=(lab,minX,maxX)=>{ const v=items.filter(i=>Math.abs(i.y-lab.y)<3&&i.x>lab.x+5&&i.x>=minX&&i.x<maxX&&!/:\s*$/.test(i.s)).sort((a,b)=>a.x-b.x); return norm(v.map(x=>x.s).join(" ")).replace(/^:\s*/,""); };
    const findLabel=(re,cond=()=>true)=>items.find(i=>re.test(i.s)&&cond(i));
    const header=findLabel(/^Child Name\s*:?/);
    if(header){
      cur={name:"",parents:[],ifsp:""}; kids.push(cur);
      const inline=header.s.replace(/^Child Name\s*:\s*/,""); cur.name=inline||rowVal(header,header.x,99999);
      const fk=findLabel(/^Family Account Key/); if(fk) cur.familyKey=fk.s.replace(/^Family Account Key\s*:\s*/,"")||rowVal(fk,fk.x,header.x);
      const ci=findLabel(/^Child Information/); const below=i=>ci?i.y>ci.y:true;
      const field=re=>{ const l=findLabel(re,i=>below(i)&&i.x<mid); return l?rowVal(l,l.x,mid+200):""; };
      cur.gender=field(/^Gender\s*:/); cur.dob=field(/^Date of Birth\s*:/); cur.classroom=field(/^Primary Classroom\s*:/); cur.program=field(/^Program\s*:/); cur.schedule=field(/^Schedule\s*:/); cur.enrollDate=field(/^Enrollment Date\s*:/);
      const p1=findLabel(/^Parent 1/), p2=findLabel(/^Parent 2/); const ft=findLabel(/^Family Type/); const stopY=ft?ft.y:(ci?ci.y:99999);
      const pb=(head,minX,maxX)=>{ if(!head) return null; const g=re=>{ const l=items.find(i=>re.test(i.s)&&i.y>head.y&&i.y<stopY&&i.x>=minX&&i.x<maxX); return l?rowVal(l,minX,maxX):""; };
        const p={name:g(/^Name\s*:/),cell:g(/^Cell Phone\s*:/),email:g(/^Email\s*:/)}; return p.name?p:null; };
      const a=pb(p1,0,mid-40), b=pb(p2,mid-40,99999); if(a) cur.parents.push(a); if(b) cur.parents.push(b);
    } else if(cur){
      const ifsp=findLabel(/^IFSP\s*:/); if(ifsp) cur.ifsp=rowVal(ifsp,ifsp.x,mid);
    }
  }
  return kids.filter(k=>k.name).map(k=>{ const parts=k.name.split(" "); return {first:parts[0]||"",last:parts.slice(1).join(" "),dob:toISODate(k.dob),gender:k.gender,classroom:k.classroom,program:k.program,schedule:k.schedule,enrollDate:toISODate(k.enrollDate),familyKey:k.familyKey||"",parents:k.parents,ifsp:k.ifsp}; });
}
const ROSTER_KEYS=[["classroom","Classroom"],["program","Program"],["schedule","Schedule"],["dob","Birthdate"],["enrollDate","Enrolled"],["ifsp","IEP/IFSP"],["gender","Gender"]];
function openRosterImport(){
  openModal(`<h2>Update the roster from 1Core</h2>
    <p class="small muted" style="margin:0">In 1Core, export the Family Information Sheets as a PDF and upload it here. You will see every change before anything is saved.</p>
    <label class="drop" id="rdrop" for="r-file"><b>Choose the PDF or drop it here</b></label><input type="file" id="r-file" accept=".pdf,application/pdf" hidden>
    <div id="r-status"></div><div class="modal-foot" id="r-foot"><button class="btn" data-act="close">Cancel</button></div>`,{wide:true});
  const run=async f=>{
    $("#r-status").innerHTML=`<div class="progress-note"><span class="spinner"></span>Reading ${esc(f.name)}…</div>`;
    try{ const r=await readPdf(f); const list=parseRosterPages(r.pages); if(!list.length) throw new Error("No Family Information Sheets were found in this PDF."); showRosterDiff(list); }
    catch(e){ $("#r-status").innerHTML=`<div class="notice">${esc(e.message||"The PDF could not be read.")}</div>`; }
  };
  const inp=$("#r-file"), drop=$("#rdrop"); inp.onchange=()=>inp.files[0]&&run(inp.files[0]);
  drop.ondragover=e=>{e.preventDefault();drop.classList.add("over");}; drop.ondragleave=()=>drop.classList.remove("over"); drop.ondrop=e=>{e.preventDefault();drop.classList.remove("over");e.dataTransfer.files[0]&&run(e.dataTransfer.files[0]);};
}
function findExisting(k){
  const nm=s=>String(s||"").toLowerCase().replace(/[^a-z]/g,"");
  const all=Object.values(S.children);
  return all.find(c=>nm(childName(c))===nm(k.first+" "+k.last)&&(!c.dob||!k.dob||c.dob===k.dob)) || all.find(c=>c.dob&&c.dob===k.dob&&nm(c.first)===nm(k.first));
}
function showRosterDiff(list){
  const adds=[], changes=[], seen=new Set();
  list.forEach(k=>{ const ex=findExisting(k); if(!ex){ adds.push(k); return; } seen.add(ex.id);
    const diffs=ROSTER_KEYS.filter(([f])=>(k[f]||"")!==(ex[f]||"") && (k[f]||"")).map(([f,l])=>({f,l,from:ex[f]||"",to:k[f]}));
    const pa=JSON.stringify((k.parents||[]).map(p=>[p.name,p.cell,p.email])), pb=JSON.stringify((ex.parents||[]).map(p=>[p.name,p.cell,p.email]));
    if(pa!==pb && k.parents?.length) diffs.push({f:"parents",l:"Family contacts",from:(ex.parents||[]).map(p=>p.name).join(", "),to:k.parents.map(p=>p.name).join(", ")});
    if(ex.status==="withdrawn") diffs.push({f:"status",l:"Enrollment",from:"Withdrawn",to:"Enrolled"});
    if(diffs.length) changes.push({k,ex,diffs}); });
  const missing=Object.values(S.children).filter(c=>c.status!=="withdrawn"&&!seen.has(c.id));
  S.rosterDiff={adds,changes,missing};
  $("#r-status").innerHTML=`
    <p><b>${list.length}</b> children found in the PDF. <b>${adds.length}</b> new, <b>${changes.length}</b> with changes, <b>${missing.length}</b> on this roster but missing from the PDF.</p>
    ${adds.length?`<h3>New children</h3>${adds.map((k,i)=>`<label class="check"><input type="checkbox" data-add="${i}" checked><span><b>${esc(k.first+" "+k.last)}</b> · ${esc(k.classroom)} · born ${esc(fmtDate(k.dob))}</span></label>`).join("")}`:""}
    ${changes.length?`<h3 style="margin-top:12px">Changed details</h3>${changes.map((c,i)=>`<label class="check"><input type="checkbox" data-chg="${i}" checked><span><b>${esc(childName(c.ex))}</b>${c.diffs.map(d=>`<br><span class="small">${esc(d.l)} <span class="diff-old">${esc(d.from||"blank")}</span> to ${esc(d.to)}</span>`).join("")}</span></label>`).join("")}`:""}
    ${missing.length?`<h3 style="margin-top:12px">Missing from the PDF</h3><p class="small muted" style="margin:0">Tick any child who has left to mark them withdrawn. Their conference history stays.</p>${missing.map((c,i)=>`<label class="check"><input type="checkbox" data-miss="${i}"><span>${esc(childName(c))} · ${esc(c.classroom||"")}</span></label>`).join("")}`:""}
    ${!adds.length&&!changes.length&&!missing.length?`<p class="muted">The roster already matches this PDF.</p>`:""}`;
  $("#r-foot").innerHTML=`<button class="btn" data-act="close">Cancel</button><button class="btn primary" id="r-apply" ${!adds.length&&!changes.length&&!missing.length?"disabled":""}>Apply selected changes</button>`;
  $("#r-apply").onclick=applyRosterDiff;
}
async function applyRosterDiff(){
  const {adds,changes,missing}=S.rosterDiff; const btn=$("#r-apply"); btn.disabled=true; btn.textContent="Saving…";
  let n=0;
  try{
    for(const el of $$("[data-add]:checked")){ const k=adds[+el.dataset.add]; let id=slug(k.first+" "+k.last)+"-"+(k.dob||"").replace(/-/g,""); if(S.children[id]) id+="-"+uid().slice(0,4);
      await dbSet("children/"+id,{...k,status:"active",source:"1core",createdAt:nowISO(),updatedAt:nowISO()}); n++; }
    for(const el of $$("[data-chg]:checked")){ const c=changes[+el.dataset.chg]; const upd={updatedAt:nowISO()}; c.diffs.forEach(d=>{ if(d.f==="parents") upd.parents=c.k.parents; else if(d.f==="status") upd.status="active"; else upd[d.f]=c.k[d.f]; });
      const {id:_,...prev}=c.ex; await dbSet("children/"+c.ex.id,{...prev,...upd}); n++; }
    for(const el of $$("[data-miss]:checked")){ const c=missing[+el.dataset.miss]; const {id:_,...prev}=c; await dbSet("children/"+c.id,{...prev,status:"withdrawn",withdrawnAt:nowISO(),updatedAt:nowISO()}); n++; }
    closeModal(); toast(`${n} roster ${n===1?"change":"changes"} saved`);
  }catch(e){ btn.disabled=false; btn.textContent="Apply selected changes"; }
}

boot();
